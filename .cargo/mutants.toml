    # gamut-color lab.rs — the CIELab companding branches are *tangent* at the junction: the
    # cube-root and linear forms both evaluate to 6/29 (L* = 8) at t = ε = 216/24389 exactly, by
    # construction of the exact rationals (that tangency is the reason ICC mandates them). `>` vs
    # `>=` differs only on inputs whose reduced tristimulus (or its cube, in the inverse) equals ε
