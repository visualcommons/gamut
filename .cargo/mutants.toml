    #   difference landing bit-exactly on a decimal threshold, none of which is reachable
    #   (the thresholds are not representable on those values' result grids). The reachable
    #   disagreements of `<`→`==` ARE killed (fit_root_replicates_the_lcms2_determinant_cutoff,
    #   equal_black_points_and_d50_coincidence_skip_compensation).
    'replace < with <= in below_tolerance',
    #   clip_probe_l (the darker-colorant L* clip, cmssamp.c:129-134): `> 95` vs `>= 95` is
    #   decided only at L* == 95.0 exactly, which no 16-bit Lab encoding produces (v4 needs
    #   raw 62258.25, v2 the non-representable 62016/652.8 quotient); the `< 0` arm is dead
    #   in this crate's decoded pipelines (every PCS decode yields L* ≥ 0 — ToneCurve clamps
    #   encodings to [0, 1] and XYZ decodes are non-negative), kept as lcms2 transcription
    #   fidelity, and at the one reachable disagreement point (L* == 0) both variants of both
    #   mutations still return 0. The `> `→`==`, `||`→`&&`, and body mutants ARE killed
    #   (high_l_probe_clips_to_zero_not_fifty and the pedestal probe pins).
    'replace > with >= in clip_probe_l',
    'replace < with <= in clip_probe_l',
    'replace < with == in clip_probe_l',
    # gamut-cmm gamut.rs — the one boundary twin of the transcribed GamutSampler decision
    # table (#330). ratio_excess isolates the table's ratio arm precisely so this can be
    # excluded without shadowing the killable threshold mutants in GamutCheck::excess (all
    # killed by decision_table_arms_are_transcribed_verbatim's exact-threshold pins): at
    # `ratio == threshold` exactly, the taken branch returns `ratio - threshold == 0.0` and
    # the untaken one returns 0.0 — bitwise the same output, so `>` vs `>=` cannot change
    # observable behaviour. Every other mutant in ratio_excess (the dE2 == 0 guard, the
    # division, the subtraction, the branch bodies) IS killed by the same test's exact pins.
    'replace > with >= in ratio_excess',
]
