# cargo-mutants configuration — https://mutants.rs
# Run via `mise run mutants` (full workspace) or `mise run mutants-diff` (changed code only).
# The tool is installed by mise; see `mise.toml`.

# Build & test with all features so the dav1d/libavif/libwebp differential "oracle" tests
# run — they are the strongest signal for the encoder crates. Mirrors `mise run test`
# (cargo test --workspace --all-features); mutants in gamut-av1/avif/webp therefore need the
# C toolchain + the third_party/ git submodules checked out.
all_features = true

# Don't mutate the binary/binding crates or the dev-only oracle crates: the binaries' entry points
# aren't unit-tested, and `tooling/` holds the differential *reference decoders* (dav1d/libavif) —
# the test oracle, not the system under test, so mutating it is meaningless (and its high-bit-depth
# FFI paths are only exercised once the encoder emits them). This matches the coverage gate, which
# excludes the same set (the `coverage` mise task, --ignore-filename-regex). Stub crates
# (av2/vvc) contain no function bodies and generate no mutants, so they need no entry here.
exclude_globs = [
    "crates/gamut-cli/**",
    "crates/gamut-wasm/**",
    "crates/gamut-ffi/**",
    # gamut-jxl-sys is declarations-only (hand-written `#[repr(C)]` types + `unsafe extern "C"`
    # signatures for libjxl, no function bodies), so it produces no meaningful mutants; its
    # correctness is a faithful transcription pinned by the `tests/version.rs` drift guard, not
    # behaviour cargo-mutants can exercise. Excluded like the binding/binary crates (matches the
    # coverage gate's --ignore-filename-regex).
    "crates/gamut-jxl-sys/**",
    # The facade crates carry no meaningfully complicated logic of their own: `gamut` is pure
    # feature-gated re-exports (no function bodies), and `gamut-metadata` is the thin metadata
    # facade whose per-format parsing/serialisation lives in gamut-exif/xmp/icc/iptc (each
    # mutation-tested in place). Excluded package-wide so the heavy mutants runs spend their
    # budget on the crates that own the logic.
    "crates/gamut/**",
    "crates/gamut-metadata/**",
    "tooling/**",
]

# The test suites are fast (sub-second baselines), so a mutant that runs much longer is
# almost always a genuine infinite loop. Keep a floor well above the baseline so a merely
# slow mutant on a loaded CI runner isn't misreported as a timeout, without burning minutes
# per hang.
minimum_test_timeout = 60

# Provably-equivalent mutants: ones that cannot change observable behaviour, so no test can kill
# them. They are excluded here (with the reason) rather than papered over with contrived tests.
# Each regex is scoped to one function + operator so it can only match the intended mutant — never
# a future, genuinely-killable one. Keep this list short and justified; a gap is *not* an excuse for
# an entry.
exclude_re = [
    # gamut-ifd track::subtract — the claim-normalisation details are unobservable through the
    # two-pointer walk. `r.len > 0` → `>=` only admits zero-length claims, which the walk's
    # skip loop (`r.end() <= pos`) discards before they can cover anything; and disabling the
    # merge guard leaves the claims as a sorted-but-overlapping list the walk consumes
    # identically (each arm advances `pos` monotonically over the union). Both equivalent; the
    # merge *arithmetic* is NOT excluded (killed by
    # `subtract_normalises_overlapping_claims_away_from_origin`).
    'replace > with >= in ReadLedger::subtract',
    'replace match guard r\.start <= last\.end\(\) with false in ReadLedger::subtract',
    # gamut-dng rewrite::write — the pin-fallback match guard. With `pin == None` the guard is
    # the only difference between "return the error" and "retry the identical un-pinned write
    # and return its (identical) error": `write_with` is deterministic in its inputs, so forcing
    # the guard true merely repeats the failing call before propagating the same error.
    # Equivalent; the guard-false direction (pin errors must fall back, not propagate) is killed
    # by `unsatisfiable_pin_relocates_with_bytes_intact`.
    'replace match guard pin\.is_some\(\) with true in DngRewrite::write',
    # gamut-dng decode_image_data — `factor > 1` gates the deinterleave call; at `factor == 1`
    # the field mapping is the identity (each field offset collapses to src == dst), so calling
    # it anyway changes nothing observable: `>=` is equivalent. The *stricter* mutations
    # (`==`/`<`, generated separately) skip a real factor-2 deinterleave and are killed by the
    # single-axis interleave goldens.
    'replace > with >= in decode_image_data',
    # gamut-dng version computation — `if v > *version { *version = v }` (and the analogous
    # `if backward_version > required` pick in encode): at equality both branches produce the
    # same version value, so `>=` cannot change the written tag: equivalent.
    'replace > with >= in backward_version_for',
    'replace > with >= in required_dng_version',
    'replace > with >= in DngEncoder::encode',
    # gamut-av1 quant::dequant — `sign = if dq < 0 { -1 } else { 1 }`. The sign multiplies
    # `(|dq| & 0xFF_FFFF) / dq_denom`, which is 0 exactly when `dq == 0`, the only value where
    # `<` and `<=` disagree. `±0 == 0`, so the reconstruction is identical: equivalent.
    'replace < with <= in dequant',
    # gamut-av1 cdf::diagonal_count — `w + h - 1` is the anti-diagonal count; diagonals at index
    # `≥ w+h-1` are empty (`i_lo > i_hi`), so any bound that is larger or equal walks the same
    # non-empty diagonals and yields an identical scan. All three operator mutations only enlarge
    # (or keep) the bound, hence equivalent; a *smaller* bound (not generated here) would differ.
    'replace \+ with \* in diagonal_count',
    'replace - with \+ in diagonal_count',
    'replace - with / in diagonal_count',
    # gamut-av1 filter — equivalents in the in-loop filters (the dav1d oracle pins everything else).
    # constrain: `sign = if diff < 0`, but the magnitude is 0 at `diff == 0` (the only value `<`/`<=`
    # disagree on), so `±0` makes the result identical (same shape as quant::dequant).
    'replace < with <= in constrain',
    # cdef_direction: `while i < 8` steps `i` by 2 from 1, so it only takes odd values and never
    # equals 8 — `<` and `<=` stop at the same place.
    'replace < with <= in cdef_direction',
    # cdef_partials: each directional `partial` enters the cost only as a square, so negating a whole
    # accumulator (any `+=`→`-=`) leaves every `cost += partial²` unchanged. (The `*=`, index math and
    # `- 128` centring mutants are *not* excluded — `cdef_direction_finds_dominant_direction` kills them.)
    'replace \+= with -= in cdef_partials',
    # cdef_disabled: an all-zero-strength CDEF is the identity filter, so the early-return it guards is
    # a pure optimization — taking it or running the (identity) loop produces the same output, making
    # every mutation of the predicate, and the `-> false` body, unobservable. (`-> true` skips real
    # filtering and is caught by `cdef_leaves_flat_unchanged_but_filters_structure`.)
    'replace == with != in cdef_disabled',
    'replace && with \|\| in cdef_disabled',
    'replace cdef_disabled -> bool with false',
    # sec_dir: the two secondary directions `±2` off the primary are summed symmetrically, so `dir+off`
    # vs `dir-off` selects the same pair. (`&`→`|`/`^` and the body mutants change the direction set and
    # are caught by the dav1d cdef oracle.)
    'replace \+ with - in sec_dir',
    # wide_tap_pos: the wide deblock filter is symmetric in `j` with symmetric taps, so reading row
    # `i+j` vs `i-j` sums identically. (`+`→`*` and the body are caught by the deblock oracle.)
    'replace \+ with - in wide_tap_pos',
    # loop_restore_wiener_luma: `if width == 0 || height == 0` is a defensive guard, but the encoder
    # never calls it with a zero dimension and a zero-sized plane is a no-op anyway, so `||`→`&&` (both
    # branches false for the real `≥1` dimensions) cannot change the output.
    'replace \|\| with && in loop_restore_wiener_luma',
    # centred: the §7.15.2 direction search is invariant to a uniform sample offset (each direction
    # cost is a sum of squared partials; the chosen direction is an argmax and the variance a cost
    # *difference*), so flipping the centring `- 128` to `+ 128` cannot change the result. (Verified: the
    # cdef_direction test passes under the mutant for ramp/edge/sparse inputs. `- with /` is NOT masked
    # and is caught.)
    'replace - with \+ in centred',
    # superres_err: see the doc comment — `err` reaches the offset only as `-err/2` and the `& 0x3fff`
    # discards the `2¹⁴`-multiple that `-`→`+` introduces. (The `*`/`<<`/`/` mutants are not masked.)
    'replace - with \+ in superres_err',
    # gamut-av1 tile — equivalents in the entropy/segment helpers (the snapshot + round-trip tests pin
    # everything observable). last_ref: `max - 1` is the largest valid segment ref; a ref is always
    # `< max`, so widening the threshold is never reached and the general neg_interleave path maps
    # `r == max-1` identically.
    'replace - with \+ in last_ref',
    'replace - with / in last_ref',
    # recenter: `if v > 2*ref` — at `v == 2*ref` the else branch yields `2*(v-ref) == 2*ref`, exactly the
    # value the `>=` mutant would return from the `v` branch, so the boundary is a continuity point.
    'replace > with >= in recenter',
    # gamut-bitstream `ec_partition`: its only `-` is the constant shift `7 - EC_PROB_SHIFT` (= 1,
    # since EC_PROB_SHIFT = 6). The `- → /` mutation yields `7 / EC_PROB_SHIFT` = 1 — the identical
    # value — so it is unkillable. (`- → +`/`*` give 13/42 and are caught by the round-trip tests.)
    'replace - with / in ec_partition',
    # gamut-bitstream `SymbolEncoder::finish`: `s = 10 + cnt`, and the encoder holds `cnt` in
    # [-9, -1] (verified over 200k streams), so `s >= 1` always and the `if s > 0` flush guard is
    # always taken. `> → >=` is therefore unobservable. (`> → ==`/`<` skip the loop and are caught.)
    'replace > with >= in SymbolEncoder::finish',
    # gamut-bitstream `SymbolEncoder::finish`: with `s <= 9` the flush loop runs at most twice, and
    # the `n` it shifts is only consumed on an iteration that never executes, so `n >>= 8` is dead.
    # `>>= → <<=` is unobservable. (The loop-bound and `e`/`n` init mutants stay live and are caught.)
    'replace >>= with <<= in SymbolEncoder::finish',
    # gamut-tiff `stored_total > MAX_IMAGE_BYTES` (decode_page_samples) and `tile_size > MAX_IMAGE_BYTES`
    # (decode_tiles) are *allocation* guards: relaxing `>` to `==`/`>=` only changes whether a 64 MiB+
    # buffer is reserved before the (still inevitable) decode error — the malformed file is rejected
    # either way, so the Ok/Err outcome a functional test can see is unchanged. (`> -> <` flips the
    # guard for every normal image and is caught.) These are the only `>` in either function.
    'replace > with == in decode_page_samples',
    'replace > with >= in decode_page_samples',
    'replace > with == in decode_tiles',
    'replace > with >= in decode_tiles',
    # gamut-riff `Vp8xHeader::to_payload`: the feature-flag byte ORs five single bits each shifted to
    # a distinct position (`icc<<5 | alpha<<4 | ...`), so the operands are disjoint and `|` == `^`.
    # gamut-riff `Vp8xHeader::from_payload`: the `le24` closure ORs three bytes at offsets 0/8/16
    # (`b[0] | (b[1]<<8) | (b[2]<<16)`), again disjoint. Both functions' `| -> ^` are equivalent.
    # (Regex: `\|`/`\^` escape the pipe/caret metacharacters.)
    'replace \| with \^ in Vp8xHeader::to_payload',
    'replace \| with \^ in Vp8xHeader::from_payload',
    # gamut-ifd `Value::decode`: the DOUBLE assembly OR's a 32-bit low half with a 32-bit high half
    # shifted up by 32 (`u64::from(a) | (u64::from(b) << 32)`). The operands occupy disjoint bits, so
    # `|` is identical to `^`; both `| -> ^` mutations are equivalent.
    # (Regex: `\|`/`\^` escape the pipe/caret metacharacters.)
    'replace \| with \^ in Value::decode',
    # gamut-dsp `adst_output_permute`: the index is `(d << 3) | (c << 2) | (b << 1) | a`, where each
    # of a/b/c/d is a single bit (0 or 1) shifted to a distinct position, so the OR'd operands never
    # share bits and `|` is identical to `^`. The three `| -> ^` mutations are therefore equivalent.
    # (Regex: `\|`/`\^` escape the pipe/caret metacharacters.)
    'replace \| with \^ in adst_output_permute',
    # gamut-color `vp8_clip8`: the `else if v < 0` branch is reached only when `v` is out of range
    # (`v == 0` takes the `v & !MASK2 == 0` fast path), so `v != 0` always holds there and `v < 0`
    # is equivalent to `v <= 0`. (`v < 0 → v == 0` *is* observable and is killed by a test.)
    'replace < with <= in vp8_clip8',
    # gamut-color `prophoto_rgb_eotf_standard`: the ROMM toe `x/16` and the power curve `x^1.8` are
    # equal at the x = 1/32 breakpoint (both 2^-9), so the curve is continuous and `x < 1/32` vs
    # `x <= 1/32` choose between two identical values there — unobservable. (`1.0/32.0 → 1.0%32.0`
    # *is* observable and is killed by a test at x = 0.5.)
    'replace < with <= in prophoto_rgb_eotf_standard',
    # gamut-iptc `IimBlock::parse`: every `|` assembles a big-endian length from disjoint octet
    # positions — `(hi << 8) | lo` (standard length), `(k_hi << 8) | k_lo` (extended descriptor
    # width), and `(len << 8) | byte` (extended length accumulator). In each the left operand's low
    # 8 bits are zero before the OR, so the operands never share a bit and `|` is identical to `^`.
    # All three `| -> ^` mutations are therefore equivalent. (The `<<`, `>`, and `==`/`>=` mutations
    # in this function are observable and killed by the extended-descriptor tests.)
    'replace \| with \^ in IimBlock::parse',
    # gamut-icc ProfileHeader::{is_embedded,is_transparency} test bit 0 of their field via
    # `flags & (1 << 0)`: a zero-distance shift is the identity in both directions
    # (`1 << 0` == `1 >> 0` == 1), so the mutation is provably equivalent. (The bit-1/2/3
    # accessors' shifts ARE killed by `decodes_flag_and_attribute_bits`.)
    'replace << with >> in ProfileHeader::is_embedded',
    'replace << with >> in ProfileHeader::is_transparency',
    # gamut-heic `HevcDecoder::supports` is a *defaulted trait method* whose body already is
    # `true` (the documented "I will attempt anything" default that keeps every pre-registry
    # implementation compiling, issue #273). The `-> true` replacement is therefore byte-identical
    # to the real body — provably equivalent and unkillable. The registry's *use* of the probe (push
    # order, skip-on-false, short-circuit) is fully covered by `tests/backend.rs`, and the overriding
    # implementations' `supports` mutants are not excluded.
    'replace HevcDecoder::supports -> bool with true',
    # gamut-avif `AvifEncoder::lossless`: a named, intent-revealing alias for the default encoder
    # (the default mode is already lossless), so its body *is* `Self::default()` and the
    # `-> Default::default()` replacement is byte-identical — provably equivalent, unkillable. It
    # exists to pair with `lossy()` and make the call site explicit; `new()` (also `Self::default()`)
    # generates no such mutant. This is the only mutant the function produces.
    'replace AvifEncoder::lossless -> Self with Default::default\(\)',
    # gamut-webp `WebpEncoder::lossless` returns `Self::default()` because the default configuration
    # *is* lossless (`WebpConfig::default()` = `{ Lossless, 75 }`); replacing the body with the
    # equivalent `Default::default()` cannot change behaviour, so the mutant is unkillable. (The same
    # replacement on `lossy` *is* caught — it would wrongly produce a lossless encoder.)
    'replace WebpEncoder::lossless -> Self with Default::default\(\)',
    # gamut-webp `alpha::write_compressed_alph`: `0xff00_0000 | (u32::from(a) << 8)` ORs the opaque
    # alpha byte (bits 24-31) with the green byte (bits 8-15); the operands are disjoint, so `|` == `^`.
    'replace \| with \^ in write_compressed_alph',
    # gamut-webp `transform::fwht4x4` negative-bias correction `x += i32::from(x < 0)`: the only value
    # where `<` and `<=` disagree is x == 0, where the extra +1 is absorbed by the subsequent
    # `(x + 3) >> 3` (both yield 0), so the four `< -> <=` mutations are unobservable. (The `+=`→`-=`,
    # `<`→`>` and `<`→`==` mutants ARE killed: the `[0, -1, 0, …]` golden vector drives the column
    # intermediates to ±4, where the correct and mutated roundings diverge.)
    'replace < with <= in fwht4x4',
    # gamut-webp `BoolDecoder::get_literal`: `v = (v << 1) | u32::from(get_flag())` ORs a flag bit (0
    # or 1) into a freshly-vacated low bit, so the operands are disjoint and `|` is identical to `^`.
    'replace \| with \^ in BoolDecoder<.a>::get_literal',
    # gamut-avif `backend::BitReader::bits` (the sequence-header peek over a backend-supplied AV1
    # stream): `value = (value << 1) | u32::from(bit)` ORs a 0/1 bit into the low bit the shift just
    # vacated, so the operands are disjoint and `|` is identical to `^` — the same provably-equivalent
    # shape as `BoolDecoder::get_literal` above. (The `| -> &`, `<< -> >>`, `% -> +` and `+= -> -=`/`*=`
    # mutants in the same function ARE killed by `tests/backend.rs`'s hand-built sequence headers.)
    'replace \| with \^ in BitReader<.a>::bits',
    # gamut-webp `loop_filter::s2u`: `(c(v) + 128) as u8`. `+ 128` and `- 128` differ by 256, which the
    # `as u8` truncation discards, so the result is identical — the `+ -> -` mutation is unobservable.
    'replace \+ with - in s2u',
    # gamut-webp `alpha::write_alph` returns the smaller of the raw and lossless encodings. At an exact
    # size tie `<` keeps raw and `<=` would keep compressed, but both decode to identical alpha (the
    # transform is bijective) and real content never ties, so no non-contrived test can distinguish
    # them. (`< -> >` / `< -> ==` pick the *larger*/wrong encoding and are caught by the round-trip.)
    'replace < with <= in write_alph',
    # gamut-webp VP8 header — behaviourally-equivalent bit packing/branches.
    # write_uncompressed_chunk packs disjoint fields into the frame tag (`version<<1 | 1<<4 |
    # size<<5`, each within its width) and the dimension words (`width | hscale<<14`, width ≤ 0x3FFF);
    # read_uncompressed_chunk reassembles bytes at offsets 0/8/16. Disjoint operands ⇒ `|` == `^`.
    'replace \| with \^ in write_uncompressed_chunk',
    'replace \| with \^ in read_uncompressed_chunk',
    # write_delta / write_segment_feature emit the sign bit `value < 0` only inside the `value != 0`
    # branch, where `< 0` and `<= 0` agree. (The length/show-frame guards in read_uncompressed_chunk
    # and the segment `!=` terms ARE killed by the new boundary/round-trip tests.)
    'replace < with <= in write_delta',
    'replace < with <= in write_segment_feature',
    # gamut-webp VP8 frame — behaviourally-equivalent.
    # (frame_header's LoopFilterParams literal is fully explicit — no `..Default::default()` — so a
    # `sharpness: 0` field deletion is a missing-field compile error: an *unviable* mutant rather than
    # an un-excludable equivalent survivor. cargo-mutants cannot match field deletions via exclude_re,
    # so the explicit literal is the clean way to retire that mutant.)
    # split_token_partitions reassembles the 3-byte size from disjoint bytes (`s0 | s1<<8 | s2<<16`)
    # ⇒ `|` == `^`. Its bits-16-23 byte (`s2<<16` read; `len>>16` write) is non-zero only for a single
    # token partition > 64 KiB, which gamut never emits; for every reachable size that byte is 0, so
    # `<<16`/`>>16` are identical (0). Col-anchored: the bits-8-15 shift on the same lines IS killed by
    # `token_partitions_round_trip_bit_exact`, so it must stay tested.
    'replace \| with \^ in split_token_partitions',
    'frame\.rs:1172:79: replace << with >>',
    'frame\.rs:1151:67: replace >> with <<',
    # gamut-webp VP8 encoder — correctness-preserving free choices (NOT byte-identical). These mutate
    # cost/decision *heuristics*, never the bitstream contract: they change *which* valid encoding is
    # emitted, not its validity. The decoder reconstructs exactly what was written and the libwebp
    # oracle confirms every variant round-trips, so no correctness test can distinguish them; pinning a
    # specific choice would test an encoder heuristic (rate-distortion search is issue #32), not a spec
    # requirement. Each function below feeds only an encoder decision:
    #   mb_luma_mean — per-macroblock luma average, used only to choose a quantizer segment;
    'in mb_luma_mean',
    'replace mb_luma_mean -> u32 with',
    #   block_sad — the prediction-cost proxy for mode selection;
    'in block_sad',
    #   select_luma_mode / select_chroma_mode — lowest-SAD whole-block mode pickers (any mode is legal);
    'in select_luma_mode',
    'replace select_luma_mode -> usize with',
    'in select_chroma_mode',
    'replace select_chroma_mode -> usize with',
    #   SEGMENT_QUANT_DELTAS (frame.rs:45) — the encoder's chosen per-segment quantizer spread; any
    #   spread is valid and is faithfully signalled. Line-anchored: a bare const, no enclosing fn name.
    'frame\.rs:45:40: delete -',
    'frame\.rs:45:45: delete -',
    #   encode_bpred_luma — the submode tie-break (`sad < best`) and the running prediction-cost
    #   accumulator (`total_sad +=`, used only for the B_PRED-vs-whole-block decision); both pick
    #   among valid encodings. (The residual subtraction `-` IS pinned by `encode_bpred_luma_pins_residual`.)
    'replace < with <= in encode_bpred_luma',
    'replace \+= with \*= in encode_bpred_luma',
    #   encode_frame_filtered decision heuristics (line-anchored so the structural mutants on other
    #   operators of the same kind in this large function stay tested): the per-macroblock segment
    #   assignment from luma mean (1029), the segment-map index it reads back (1049, self-consistent —
    #   the same id is signalled), and the B_PRED-vs-whole-block SAD threshold (1070).
    'frame\.rs:1029:53: replace / with',
    'frame\.rs:1049:44: replace \* with /',
    'frame\.rs:1070:59: replace < with <=',
    # gamut-webp VP8L encoder — correctness-preserving free choices. The lossless encode->decode
    # round-trip and the libwebp oracle BOTH run on these paths, so any mutant that produced an invalid
    # prefix code, an out-of-range backward reference, or a residual the inverse transform cannot undo
    # would fail them and is NOT among the survivors here. What remains are pure optimize-vs-optimize
    # choices that change which valid stream is emitted (compression density, issue #31), not its
    # validity — so no correctness test can distinguish them:
    #   estimate_color_element / best_predictor_mode — least-squares colour coefficients and the
    #   minimum-residual spatial predictor; any element/mode is reversible and is signalled per block;
    'in estimate_color_element',
    'replace estimate_color_element ->',
    'in best_predictor_mode',
    'replace best_predictor_mode ->',
    #   residual_cost — a cheap entropy proxy used only to compare predictor modes;
    'in residual_cost',
    'replace residual_cost ->',
    #   pick_cache_bits / assign_groups — the colour-cache size and the meta-Huffman block grouping
    #   (both deferred-optimization knobs, issue #31; any choice is faithfully signalled);
    'in pick_cache_bits',
    'replace pick_cache_bits ->',
    'in assign_groups',
    'replace assign_groups ->',
    #   huffman_pass — one length-limited Huffman construction pass; a suboptimal-but-valid tree only
    #   costs bits (a malformed tree fails the round-trip and is caught);
    'in huffman_pass',
    #   BackwardRefs::{hash,find,insert} — the LZ77 hash-chain matcher. Per its own contract
    #   (lz77.rs): "Correctness does not depend on the hash quality — matches are verified by
    #   comparison — only compression does." find() returns `1 <= distance <= pos` matches it verified.
    'in BackwardRefs::hash',
    'replace BackwardRefs::hash ->',
    'in BackwardRefs::find',
    'in BackwardRefs::insert',
    #   forward_color / forward_predictor / forward_color_indexing replaced wholesale — these apply the
    #   *optional* §4 transforms; skipping a transform (the `-> vec![]`/`-> ()` body) emits a valid
    #   untransformed stream. (Their per-pixel apply math is asymmetric with the inverse and IS caught
    #   by the round-trip — only the whole-body "don't transform" replacement survives.)
    'replace forward_color -> ',
    'replace forward_predictor -> ',
    'replace forward_color_indexing -> ',
    # gamut-webp VP8L — behaviourally-equivalent.
    #   make_argb packs four channels into disjoint byte lanes (`a<<24 | r<<16 | g<<8 | b`), and
    #   reverse_bits ORs a single freshly-shifted bit into a vacated position — disjoint operands, so
    #   `|` == `^`.
    'replace \| with \^ in make_argb',
    'replace \| with \^ in reverse_bits',
    #   inverse_color's `if width == 0 || height == 0` is a defensive guard; for every real (≥1×1)
    #   image both operands are false, so `||`→`&&` cannot change the result (same shape as the av1
    #   loop_restore guard above).
    'replace \|\| with && in inverse_color',
    # gamut-webp VP8L — more behaviourally-equivalent / free-choice survivors from the deep survey.
    # value_to_prefix: the `offset` it subtracts only sets bits of `extra` at or above bit
    # `num_extra_bits`; the sole caller emits exactly `num_extra_bits` low bits, so the offset's
    # high-bit contribution is masked away and the bitstream is identical (verified: the
    # lz77_value_prefix_round_trips test passes under each mutant). Line-anchored — the second `<<`/`+`
    # in the function are killable.
