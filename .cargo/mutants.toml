    'replace > with >= in lab_to_xyz',
    # CIEDE2000 hue plumbing (Sharma et al. 2005). `wrap_hue_diff` folds Δh′ into (−180°, 180°]
    # and feeds only `sin(Δh′/2)` (Eq. (11)), which is 360°-periodic — so adding versus
    # subtracting 360° is provably unobservable (`- with +` / `+ with -`), and the strict-vs-
