    'replace - with \+ in wrap_hue_diff',
    'replace \+ with - in wrap_hue_diff',
    'replace > with >= in wrap_hue_diff',
    'replace < with <= in wrap_hue_diff',
    # `chroma_product_is_zero` gates the degenerate hue conventions of Eqs. (10)/(14). When either
    # chroma is zero every downstream hue term carries the factor √(C1′·C2′) = 0 (ΔH′ = 0, so the
    # hue and rotation terms vanish identically), making the branch choice unobservable; `*` vs
    # `+`/`/` on the product only changes *which* zero-chroma inputs take the degenerate branch.
    # The `== with !=` mutant of the same comparison flips behaviour for chromatic pairs and
    # stays killed by the Sharma golden set.
    'replace \* with \+ in chroma_product_is_zero',
    'replace \* with / in chroma_product_is_zero',
    # …and the whole-function `-> false` replacement is the same class: it only reroutes
    # zero-chroma pairs onto the general arms, whose hue terms the zero factor annihilates
