    'replace chroma_product_is_zero -> bool with false',
    # Same vanishing-term argument for the Eq. (14) degenerate sum itself: `h1′ + h2′` is only
    # consumed when ΔH′ = 0 has already zeroed every term it feeds — so its operator mutants
    # *and* every whole-function value replacement are unobservable alike.
    'replace \+ with (-|\*) in degenerate_hue_sum',
    'replace degenerate_hue_sum -> f64 with',
    # The Eq. (14) mean-hue `sum < 360` boundary: `<` vs `<=` differs only when h1′ + h2′ ==
