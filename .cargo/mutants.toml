    'replace < with <= in below_tolerance',
    #   clip_probe_l (the darker-colorant L* clip, cmssamp.c:129-134): `> 95` vs `>= 95` is
    #   decided only at L* == 95.0 exactly, which no 16-bit Lab encoding produces (v4 needs
