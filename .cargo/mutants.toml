    'replace > with >= in clip_probe_l',
    'replace < with <= in clip_probe_l',
    'replace < with == in clip_probe_l',
    # gamut-cmm gamut.rs — the one boundary twin of the transcribed GamutSampler decision
    # table (#330). ratio_excess isolates the table's ratio arm precisely so this can be
    # excluded without shadowing the killable threshold mutants in GamutCheck::excess (all
