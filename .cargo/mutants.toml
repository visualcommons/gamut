    # transform at `DEFAULT_TRANSFORM_BITS` (4), where `4 - 2` and `4 / 2` are both 2, so no input
    # separates the two. The *predictor* transform's identical expression is NOT excluded: plans
    # emit it at 2, 3, 4, 5 and 6, and the effort byte-pins kill it there.
    'encoder\.rs:.*: replace - with / in encode_spatial',
    # gamut-webp VP8L `single_group` (encoder.rs) — the degenerate assignment puts every
    # meta-block in one prefix-code group, and a `GroupAssignment` with `num_groups == 1` never has
    # its grid consulted: `group_of` returns 0 before touching `grid_width` or `block_group`
    # (`num_groups <= 1` short-circuit), and the entropy sub-image is only emitted, and
    # `block_group` only iterated, when `num_groups > 1`. The grid arithmetic these mutants corrupt
