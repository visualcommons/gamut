    # gamut-heic (issue #238) — behaviourally-equivalent survivors.
    # `Reader::u48` (hvcc.rs) assembles a 48-bit big-endian value byte-by-byte via
    # `(acc << 8) | u64::from(byte)`: the running accumulator is shifted up 8 bits before each OR, so
    # its low 8 bits are always zero and never overlap the freshly-read byte (0..=255). Disjoint
    # operands ⇒ `|` is identical to `^`; the `| -> ^` mutant is provably equivalent (same shape as
