    # ±360° shift of either hue to the identical h̄′ (that invariance is the point of its
    # adjustment arms). Provably equivalent.
    'replace < with <= in ciede2000_hue_deg',
    # gamut-cmm curve.rs — provably-equivalent mutants in tone-curve inversion/monotonicity.
    #   is_monotonic: deleting the tabulated arm falls through to the dense-probe path; both
    #   tabulated representations hold exactly MONOTONICITY_PROBES entries by construction
    #   (INVERSE_SAMPLES for SampledInverse, JOIN_POINTS for the Table a curve join builds —
    #   all three constants are 4096, deliberately matched so monotonicity is judged at the
    #   resolution these tables resolve), and probing at i/(PROBES − 1) evaluates the linear
    #   interpolant exactly at every entry: verified over all 4096 positions, `(i/4095)·4095`
