# Dev-only differential oracle: NOT a member of the gamut workspace (listed under
# `[workspace].exclude` in the root manifest). Nothing depends on it — it is invoked directly by
# manifest path, via `mise run test-c2pa`, so `cargo test --workspace --all-features` never builds
# or runs it.
#
# It drives `c2pa-rs`, the C2PA reference implementation, against gamut's container crates in both
# of the directions the #239 epic names: gamut reserves a manifest-store slot and an external
# signer completes it, and `c2pa-rs` embeds a store that gamut must locate at the identical byte
# range. See README.md for why gamut owns the locate/bound step at all.
[package]
name = "c2pa-oracle"
version = "0.0.0"
edition = "2024"
publish = false
description = "Dev-only differential oracle: cross-checks gamut's C2PA manifest-store carriage against c2pa-rs, in both directions (issue #447)."
license = "MIT OR Apache-2.0"

[lib]
doctest = false

[dependencies]
# The oracle itself: the C2PA reference implementation (Apache-2.0 OR MIT).
#
# `default-features = false` is NOT optional, and `tests/build_configuration.rs` fails if this
# line ever loses it. c2pa's default feature set is `["openssl", "default_http"]`; the `openssl`
# feature pulls OpenSSL in **vendored**, compiling it from C source into a dev build. The #239
# epic's "no crypto in the shipped graph" criterion exists to keep that out, and a vendored
# OpenSSL build would also make this the slowest thing in CI. `rust_native_crypto` is the
# pure-Rust signing/verification backend that replaces it; dropping `default_http` additionally
# drops reqwest and ureq, which this oracle never needs because it fetches no remote manifests.
c2pa = { version = "0.90.21", default-features = false, features = ["rust_native_crypto"] }

[dev-dependencies]
# The crates under test. Both locate a C2PA manifest store in a top-level ISOBMFF `uuid`
# `ContentProvenanceBox`; `gamut-avif` additionally *reserves* and *writes* one, which is the only
# direction that needs a gamut encoder.
gamut-avif = { path = "../../crates/gamut-avif" }
gamut-heic = { path = "../../crates/gamut-heic" }
gamut-core = { path = "../../crates/gamut-core" }
