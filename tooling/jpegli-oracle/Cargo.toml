# Dev-only oracle: NOT a member of the gamut workspace (listed under `[workspace].exclude` in the
# root manifest, pulled in only as a path `dev-dependency`). It statically links **jpegli**, the
# JPEG encoder/decoder from the libjxl project, compiled with the `cc` crate straight from the
# libjxl source tree that the `jpegxl-src` crate vendors (plus the highway SIMD library vendored
# beside it), so the build is hermetic: no CMake, no system libraries, no network beyond the
# crates.io download Cargo already pins by checksum.
#
# Why `jpegxl-src` 0.11.4 and not the 0.12.0 that gamut-jxl-sys pins: libjxl 0.12 moved jpegli out
# of its tree (to the separate google/jpegli repository), so the 0.12.0 package carries no
# `lib/jpegli`. 0.11.4 vendors libjxl v0.11.2, the last release that ships jpegli in-tree. Only its
# sources are used — `jpegxl_src::build()` is never called — and the dependency exists so Cargo
# downloads and checksums exactly that tree; `build.rs` then locates it (see `libjxl_dir`).
#
# jpegli's public API is the libjpeg-6b one renamed (`jpegli_*`), so it needs libjpeg's
# `jpeglib.h`/`jmorecfg.h`; those come from the workspace's `third_party/libjpeg-turbo` submodule
# (the same checkout `libjpeg-oracle` builds), with a `jconfig.h` generated by `build.rs`. jpegli
# defines only `jpegli_*` symbols, so it links beside `libjpeg-oracle` without a clash.
#
# Like libjpeg, jpegli reports fatal errors by `longjmp`, so the encode/decode surface lives behind
# the small `extern "C"` shim in `src/shim.cc`, which owns the `setjmp` guard.
[package]
name = "jpegli-oracle"
version = "0.0.0"
edition = "2024"
publish = false
description = "Dev-only FFI oracle: encodes and decodes JPEG (including jpegli's XYB mode) with a vendored, statically-linked jpegli for gamut-jpeg's cross-checks."
license = "MIT OR Apache-2.0"
build = "build.rs"
# Declares this crate as the sole provider of the native `jpegli` library.
links = "jpegli"

[lib]
doctest = false

[build-dependencies]
cc = "1"
# Source only (see the header): pinned exactly, because `build.rs` transcribes the jpegli source
# list of the libjxl release this version vendors.
jpegxl-src = "=0.11.4"

# Its own workspace root, so cargo never walks further up looking for one: a checkout nested
# inside another gamut checkout (a worktree under `.claude/worktrees/`) would otherwise find the
# outer manifest, which does not exclude this path.
[workspace]
