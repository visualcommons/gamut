# Dev-only oracle: NOT a member of the gamut workspace (listed under `[workspace].exclude` in the
# root manifest, pulled in only as a path `dev-dependency`). It builds exiv2 0.28 from the
# `third_party/exiv2` submodule (with its bundled Adobe XMP Toolkit, XMPCore) and the
# `third_party/expat` submodule it depends on, links them behind a small `extern "C"` shim, and lets
# gamut's conformance tests round-trip their XMP/EXIF through the authoritative reference engine and
# check, at the image-container level (PNG/WebP/TIFF/BMFF), that each side reads what the other
# embeds.
#
# Hermetic: expat is vendored and built from source, so the only system library needed is zlib (as
# the existing C oracles already require); see `build.rs`.
[package]
name = "exiv2-oracle"
version = "0.0.0"
edition = "2024"
publish = false
description = "Dev-only FFI oracle: round-trips XMP/EXIF through exiv2 (with its bundled Adobe XMPCore) and reads/writes EXIF, XMP and ICC at the image-container level (PNG/WebP/TIFF/BMFF) for gamut's conformance cross-checks."
license = "MIT OR Apache-2.0"
build = "build.rs"
# Declares this crate as the sole provider of the native `exiv2` library.
links = "exiv2"

[lib]
doctest = false

[build-dependencies]
cc = "1"
# Normalises ambient compiler-launcher env (sccache/ccache) so this build is hermetic to
# exactly what it configures. See its crate docs.
build-env = { path = "../build-env" }
