# Dev-only oracle: NOT a member of the gamut workspace (listed under `[workspace].exclude` in the
# root manifest, pulled in only as a path `dev-dependency`). It compiles the Adobe DNG SDK 1.7.1
# headless from the ZIP at `references/dng/` (via the `cc` crate) and links it behind a small
# `extern "C"` shim, so gamut-dng's conformance tests can validate their output against the
# authoritative reference implementation.
#
# XMP is disabled (no Linux XMP toolkit ships), zlib is the static stock build `zlib-oracle` makes
# from the `third_party/zlib` submodule (pinned, not the system libz: see issue #618), and the libjxl C
# API — which DNG 1.7.1 wires in unconditionally — is satisfied by the **real libjxl 0.12.0**
# that `gamut-jxl-sys` statically builds (its `links = "jxl"` guarantees one copy per binary even
# when a test also links gamut-jxl's encoder), making the oracle genuinely JXL-capable. Under
# `GAMUT_JXL_SYS_SKIP_NATIVE=1` (check-only environments without cmake) the link-only stubs in
# `src/jxl_stub.cpp` take over. See `build.rs` for the full recipe.
[package]
name = "gamut-dng-oracle"
version = "0.0.0"
edition = "2024"
publish = false
description = "Dev-only FFI oracle: validates DNG files with the headless-built Adobe DNG SDK 1.7.1 for gamut-dng's conformance cross-checks."
license = "MIT OR Apache-2.0"
build = "build.rs"
# Declares this crate as the sole provider of the native `dng_oracle` library.
links = "dng_oracle"

[lib]
doctest = false

[dependencies]
tempfile = "3"
# Provides the statically built libjxl the SDK's JPEG XL reader calls, plus (via `links = "jxl"`
# metadata) the matching header path for `build.rs`. Never used from Rust.
gamut-jxl-sys = { path = "../../crates/gamut-jxl-sys" }
# The zlib the SDK's Deflate reader calls: a static stock zlib built from the `third_party/zlib`
# submodule, plus (via `links = "z"` metadata) the matching header path for `build.rs`. Linked
# statically rather than resolved by the loader, so the same commit runs the same inflate on every
# machine and under every launcher (issue #618). Never called from Rust.
zlib-oracle = { path = "../zlib-oracle" }

[build-dependencies]
cc = "1"
zip = "2"

# Its own workspace root, so cargo never walks further up looking for one: a checkout nested
# inside another gamut checkout (a worktree under `.claude/worktrees/`) would otherwise find the
# outer manifest, which does not exclude this path.
[workspace]
