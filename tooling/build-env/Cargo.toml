# Dev-only build helper: NOT a member of the gamut workspace (it is listed under
# `[workspace].exclude` in the root manifest). It is consumed only as a path
# `[build-dependencies]` of the oracle crates (and of `nasm-vendor`), which are themselves
# excluded, so a plain `cargo build` of the shipped crates never compiles it. Because it is
# excluded it cannot use `*.workspace = true` inheritance, so metadata is local.
[package]
name = "build-env"
version = "0.0.0"
edition = "2024"
publish = false
description = "Dev-only helper that normalises ambient compiler-launcher environment (sccache/ccache/distcc) so the vendored C/C++ oracle builds are hermetic to exactly what they configure."
license = "MIT OR Apache-2.0"

[lib]
# The crate is consumed by build scripts; it has no doctests.
doctest = false

[dependencies]
# Intentionally none: this crate is pure `std` string/path handling, so every oracle can depend
# on it without adding anything to the build graph. `cc::Build` sites need no help — the `cc`
# crate already parses a launcher-prefixed `CC` correctly (see the crate docs).

# Its own workspace root, so cargo never walks further up looking for one: a checkout nested
# inside another gamut checkout (a worktree under `.claude/worktrees/`) would otherwise find the
# outer manifest, which does not exclude this path.
[workspace]
