# Dev-only oracle: NOT a member of the gamut workspace (listed under
# `[workspace].exclude` in the root manifest, pulled in only as a path
# `dev-dependency`). It statically links libtiff (built from the
# `third_party/libtiff` submodule against a static vendored zlib; every other
# optional codec is disabled. Used by gamut-tiff's differential cross-checks.
[package]
name = "libtiff-oracle"
version = "0.0.0"
edition = "2024"
publish = false
description = "Dev-only FFI oracle: encodes/decodes TIFF files with a vendored, statically-linked libtiff for gamut's conformance cross-checks."
license = "MIT OR Apache-2.0"
build = "build.rs"
# Declares this crate as the sole provider of the native `tiff` library.
links = "tiff"

[lib]
doctest = false

[dependencies]
tempfile = "3"

[build-dependencies]
bindgen = "0.71"
# Normalises ambient compiler-launcher env (sccache/ccache) so this build is hermetic to
# exactly what it configures. See its crate docs.
build-env = { path = "../build-env" }

# Its own workspace root, so cargo never walks further up looking for one: a checkout nested
# inside another gamut checkout (a worktree under `.claude/worktrees/`) would otherwise find the
# outer manifest, which does not exclude this path.
[workspace]
