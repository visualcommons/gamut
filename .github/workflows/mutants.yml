name: Mutants

# Mutation testing with cargo-mutants (https://mutants.rs). cargo-mutants is installed from
# the pinned `mise.toml` entry via mise, so CI and local use the same binary.
#
# Two jobs:
#   * incremental — runs on every PR, mutating only the code changed in the diff
#     (`--in-diff`). BLOCKING: a surviving mutant in changed code fails the check, so new
#     code must be mutation-covered.
#   * full — manual (workflow_dispatch) full-workspace survey. Informational only
#     (continue-on-error) and uploads a report; existing code still has gaps, so it must
#     not gate merges. Flip to blocking once the baseline is clean.
#
# Both jobs invoke `mise run mutants`, never `cargo mutants` directly. That runner
# (tooling/mutants/run.sh) derives every parallelism dial from GAMUT_MUTANTS_BUDGET_GB and
# applies the memory guards, so CI, a local run and an agent's debug loop are the same code path
# with the same numbers. When this workflow spelled its own invocation it was the one
# oracle-building lane running with cargo-mutants' stock defaults — jobserver-tasks = NCPUS, no
# CARGO_BUILD_JOBS cap, no sccache — which is exactly the configuration ci.yml documents as
# exhausting a 16 GB runner and getting the step SIGKILLed with no diagnostic.

on:
  pull_request:
  workflow_dispatch:
  # Uncomment to also run a full survey weekly (Mondays 06:00 UTC):
  # schedule:
  #   - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: mutants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mutate only the code changed by the PR. Fast and blocking.
  incremental:
    # Sharded because the runners are preemptible. A single pass over a large PR's mutants runs
    # 80-plus minutes, and runs of that length were being killed partway through — "the runner has
    # received a shutdown signal" — at 51, 64 and 85 minutes across five attempts, every one of
    # them having missed nothing. The work is embarrassingly parallel and cargo-mutants shards it
    # natively, so four shards of roughly twenty minutes each finish inside the window instead of
    # racing it. Same total compute, and a lost shard costs a quarter of the job rather than all
    # of it.
    name: Incremental (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # 14 GiB of the runner's 16: the runner needs the rest, and the runner script derives
      # MUTANTS_JOBS, CARGO_BUILD_JOBS, CMAKE_BUILD_PARALLEL_LEVEL and RUST_TEST_THREADS from
      # this one number. On a four-core runner it yields CARGO_BUILD_JOBS=2, the value ci.yml's
      # lint and coverage lanes already proved on this hardware.
      GAMUT_MUTANTS_BUDGET_GB: 14
      # The mise tasks are already installed below; never build a missing one mid-run.
      MISE_TASK_RUN_AUTO_INSTALL: false
      # The vendored C/C++ oracles are the bulk of every mutant's build and rust-cache
      # structurally cannot cache them (see the rationale in ci.yml). Without this, each of the
      # four shards rebuilds all fourteen from scratch.
      SCCACHE_GHA_ENABLED: "true"
      CC: sccache gcc
      CXX: sccache g++
    strategy:
      # Every shard must report: a green run means all four agreed, and one bad shard fails the
      # gate on its own.
      fail-fast: false
      matrix:
        # cargo-mutants numbers shards from zero: `--shard k/n` requires k < n.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          # The cross-check (oracle) tests link the vendored codecs in these submodules; mutants
          # in gamut-av1/avif/webp need them to build a green baseline. `aom`/`dav1d` are
          # `update = none` and arrive via the explicit fetch step below, not this checkout.
          submodules: recursive
          # Full history so we can diff against the PR's base branch.
          fetch-depth: 0
      - name: Install native build deps (vendored dav1d/libavif oracles; nasm is vendored)
        # Same third-party apt-source guard as ci.yml's `lint` job (issue #517): a broken
        # Chrome/Microsoft source on the runner image makes `apt-get update` exit 100, so drop
        # the entries this project does not consume, then update and install unmasked. Full
        # rationale, and why classification is per source entry, is in ci.yml.
        run: |
          # Print an apt source file with only Ubuntu's own entries; exit 10 if it had none.
          prune='
          function ok(u) { u = tolower(u); return u ~ /apt-mirrors\.txt/ || u ~ /\/\/[a-z0-9._-]+\.ubuntu\.com/ }
          function flush(  i) {
            if (n == 0) return
            if (uri == "" || ok(uri)) { for (i = 0; i < n; i++) print s[i]; if (uri != "") keep++ } else drop++
            n = 0; uri = ""
          }
          /^[ \t]*(deb|deb-src)[ \t]/ { flush(); if (ok($0)) { print; keep++ } else drop++; next }
          /^[ \t]*$/ { flush(); print; next }
          /^[ \t]*URIs:/ { uri = $0 }
          { s[n++] = $0 }
          END { flush(); exit (keep > 0 ? 0 : 10) }'
          work=$(mktemp -d)
          ubuntu=0
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            out="$work/$(echo "$f" | tr / _)"
            rc=0
            sudo awk "$prune" "$f" > "$out" || rc=$?
            case "$rc" in
              0) ubuntu=$((ubuntu + 1)) ;;
              10) ;;
              *) echo "::error::could not read or classify $f (awk exit $rc); not guessing at it"
                 exit 1 ;;
            esac
            echo "$rc" > "$out.rc"
          done
          if [ "$ubuntu" -eq 0 ]; then
            echo "::error::no Ubuntu apt source recognised; refusing to install from a stale index"
            exit 1
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            out="$work/$(echo "$f" | tr / _)"
            if [ "$(cat "$out.rc")" = 10 ]; then
              echo "removing third-party source $f"
              sudo rm -f "$f"
            elif sudo cmp -s "$out" "$f"; then
              echo "keeping $f"
            else
              echo "dropping third-party entries from $f"
              sudo rm -f "$f"
              sudo cp "$out" "$f"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants (pinned via mise)
        uses: jdx/mise-action@v4
        with:
          # Only cargo-mutants — a bare `mise install` would also build every other
          # mise.toml tool (convco, cargo-edit, …) that this job doesn't need.
          install_args: cargo:cargo-mutants
      # `aom`/`dav1d` are `update = none` in `.gitmodules` (issue #378), so the `recursive`
      # checkout above deliberately skips them; the oracle tests this job's baseline builds need
      # them, so it pulls them explicitly. Every other submodule still arrives with the checkout.
      - name: Fetch the AV1 oracle submodules
        run: mise run fetch-av1-oracles
      # The runner script diffs against the merge base itself; this fetch is what makes that
      # base resolvable, and the summary is for a human reading the log.
      - name: Fetch the base branch and summarise the changed files
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          echo "Changed files cargo-mutants will consider:"
          git --no-pager diff --stat "origin/${{ github.base_ref }}...HEAD"
      - name: Run cargo-mutants on the diff
        # Sharding is round-robin rather than the default contiguous slices; the runner passes
        # that, since mutants from one file land in one slice and a file whose tests are slow
        # would then load a single shard while the others idle.
        # GAMUT_MUTANTS_BASE is the pull request's own base branch, not master: this repo stacks
        # pull requests, and diffing a stacked branch against master would hand the gate every
        # mutant the base branch introduced too — failing it on already-reviewed code.
        env:
          GAMUT_MUTANTS_BASE: origin/${{ github.base_ref }}
        # First-class runner flags, not a `--` passthrough: mise strips that separator on some
        # versions (it did here, and the shards failed with "unknown option --no-shuffle"), so
        # CI must not depend on it surviving. `--no-shuffle` is gone because it is already
        # cargo-mutants' default.
        run: mise run mutants-diff --shard ${{ matrix.shard }}/4 --verbose
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-incremental-shard-${{ matrix.shard }}
          path: mutants.out

  # Full-workspace survey. Manual; informational only.
  full:
    name: Full workspace
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # 14 GiB of the runner's 16: the runner needs the rest, and the runner script derives
      # MUTANTS_JOBS, CARGO_BUILD_JOBS, CMAKE_BUILD_PARALLEL_LEVEL and RUST_TEST_THREADS from
      # this one number. On a four-core runner it yields CARGO_BUILD_JOBS=2, the value ci.yml's
      # lint and coverage lanes already proved on this hardware.
      GAMUT_MUTANTS_BUDGET_GB: 14
      # The mise tasks are already installed below; never build a missing one mid-run.
      MISE_TASK_RUN_AUTO_INSTALL: false
      # The vendored C/C++ oracles are the bulk of every mutant's build and rust-cache
      # structurally cannot cache them (see the rationale in ci.yml). Without this, each of the
      # four shards rebuilds all fourteen from scratch.
      SCCACHE_GHA_ENABLED: "true"
      CC: sccache gcc
      CXX: sccache g++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install native build deps (vendored dav1d/libavif oracles; nasm is vendored)
        # Same third-party apt-source guard as ci.yml's `lint` job (issue #517): a broken
        # Chrome/Microsoft source on the runner image makes `apt-get update` exit 100, so drop
        # the entries this project does not consume, then update and install unmasked. Full
        # rationale, and why classification is per source entry, is in ci.yml.
        run: |
          # Print an apt source file with only Ubuntu's own entries; exit 10 if it had none.
          prune='
          function ok(u) { u = tolower(u); return u ~ /apt-mirrors\.txt/ || u ~ /\/\/[a-z0-9._-]+\.ubuntu\.com/ }
          function flush(  i) {
            if (n == 0) return
            if (uri == "" || ok(uri)) { for (i = 0; i < n; i++) print s[i]; if (uri != "") keep++ } else drop++
            n = 0; uri = ""
          }
          /^[ \t]*(deb|deb-src)[ \t]/ { flush(); if (ok($0)) { print; keep++ } else drop++; next }
          /^[ \t]*$/ { flush(); print; next }
          /^[ \t]*URIs:/ { uri = $0 }
          { s[n++] = $0 }
          END { flush(); exit (keep > 0 ? 0 : 10) }'
          work=$(mktemp -d)
          ubuntu=0
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            out="$work/$(echo "$f" | tr / _)"
            rc=0
            sudo awk "$prune" "$f" > "$out" || rc=$?
            case "$rc" in
              0) ubuntu=$((ubuntu + 1)) ;;
              10) ;;
              *) echo "::error::could not read or classify $f (awk exit $rc); not guessing at it"
                 exit 1 ;;
            esac
            echo "$rc" > "$out.rc"
          done
          if [ "$ubuntu" -eq 0 ]; then
            echo "::error::no Ubuntu apt source recognised; refusing to install from a stale index"
            exit 1
          fi
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            out="$work/$(echo "$f" | tr / _)"
            if [ "$(cat "$out.rc")" = 10 ]; then
              echo "removing third-party source $f"
              sudo rm -f "$f"
            elif sudo cmp -s "$out" "$f"; then
              echo "keeping $f"
            else
              echo "dropping third-party entries from $f"
              sudo rm -f "$f"
              sudo cp "$out" "$f"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants (pinned via mise)
        uses: jdx/mise-action@v4
        with:
          # Only cargo-mutants — a bare `mise install` would also build every other
          # mise.toml tool (convco, cargo-edit, …) that this job doesn't need.
          install_args: cargo:cargo-mutants
      # `aom`/`dav1d` are `update = none` in `.gitmodules` (issue #378), so the `recursive`
      # checkout above deliberately skips them; the oracle tests this job's baseline builds need
      # them, so it pulls them explicitly. Every other submodule still arrives with the checkout.
      - name: Fetch the AV1 oracle submodules
        run: mise run fetch-av1-oracles
      - name: Run cargo-mutants over the whole workspace
        # Informational: surviving mutants in existing code don't fail the run.
        continue-on-error: true
        # `--all-at-once` is the deliberate opt-in past the runner's guard against an unsharded
        # whole-workspace run. This job is the one place that guard is meant to be waived: it is
        # manual, it is not a gate, and a full survey is the whole point of it.
        run: mise run mutants --all-at-once --verbose
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-full
          path: mutants.out
