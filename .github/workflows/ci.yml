name: CI

on:
  push:
    branches: [master]
  pull_request:

# Supersede in-flight runs for the same ref. Deliberately PR-only: on `push: master` a rapid
# second merge must not cancel the first commit's run and leave that commit with no CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The vendored C/C++ oracles (libaom, dav1d, libavif, libheif, exiv2, libjpeg-turbo, the DNG SDK,
# libjxl, …) dominate CI: they are local path crates — the `tooling/` oracles are
# `[workspace].exclude` entries reached as path dev-dependencies, and libjxl builds inside the
# member `gamut-jxl-sys` — and Swatinem/rust-cache deliberately drops local crates, including
# their build-script OUT_DIRs where every static archive lives, so before sccache each heavy job
# rebuilt all fourteen from scratch (~9 min, paid twice per PR).
#
# sccache is the right tool because it is content-addressed on preprocessed source + compiler +
# flags: a `third_party/` submodule bump changes the content, changes the hash, and misses. There
# is no cache key for a future change to under-specify, so a stale oracle — tests silently passing
# against the wrong reference implementation — is not a reachable state. The GHA backend is one
# store shared by every job, which matters because `cargo llvm-cov` builds into its own
# `target/llvm-cov-target/` and can share nothing with the lint lane through rust-cache.
#
# `CC`/`CXX` carry the launcher; `tooling/build-env` moves it to `CMAKE_{C,CXX}_COMPILER_LAUNCHER`
# per spawned cmake/meson command (see that crate's docs for the two failure modes this avoids).
# The three env vars are set per-job rather than here, so the `fast` job — which installs no
# sccache because it compiles no native code — can never inherit a `CC` it cannot run.

jobs:
  # Everything that needs neither the submodules nor a C toolchain, so the "you forgot to run fmt"
  # round trip is ~90 seconds instead of the length of the heavy lanes.
  fast:
    name: Format & Metadata
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # convco walks base..head, so it needs full history
      - uses: jdx/mise-action@v4
        with:
          # convco for the commit check, jq for the feature-table check. No cmake/ninja/meson:
          # nothing here builds native code.
          install_args: cargo:convco jq
      - name: Clear pre-installed Rust toolchain
        # Same rustup `bin/cargo-fmt` reinstall-conflict guard as the heavy jobs below.
        run: rustup toolchain uninstall stable || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        # Self-installs the nightly rustfmt it needs (rustfmt.toml's import options are nightly-only).
        run: mise run fmt-check
      - name: gamut-ffi feature sync
        run: mise run check-ffi-features
      - name: Release dependency graph
        run: mise run check-release-deps
      - name: Test conventions (docs/testing.md)
        # Static: greps the tree, builds nothing, sub-second. Enforces that every integration-test
        # file names what it pins, that every proptest configuration pins its seed and disables
        # failure persistence, and that differential files lead with `oracle`.
        #
        # The seed rule is the load-bearing one: the `--in-diff` mutation job is blocking, so a
        # property depending on OS entropy would make cargo-mutants report CAUGHT or MISSED for the
        # same mutant on different runs.
        run: mise run check-tests
      - name: Check PR commit messages
        # Only PRs have a base..head range; validate just the PR's own commits so the pre-existing
        # non-conventional history on master doesn't fail the check.
        if: github.event_name == 'pull_request'
        run: convco check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  lint:
    name: Clippy & Doctests
    runs-on: ubuntu-latest
    env:
      # Run the same mise tasks CI and the git hooks share, but keep this job lean:
      # without this, `mise run` would build every mise.toml tool (convco, cargo-edit,
      # cargo-mutants, …) from source before each task. This job only needs the native
      # build tools installed below plus the rustup toolchain, so skip that install.
      MISE_TASK_RUN_AUTO_INSTALL: false
      # The vendored C++ oracles (DNG SDK, exiv2, libheif, libjpeg-turbo, libjxl, …) build via
      # `cmake --build --parallel`, which takes every core and does not join cargo's jobserver.
      # Cargo runs those build scripts concurrently, so the compiler count is jobs × cores, not
      # jobs: enough concurrent cc1plus (~0.5-1.5 GB per C++ TU) to exhaust the 16 GB runner and
      # get the step SIGKILLed with no diagnostic (exit 137; exit 143 when it lands as SIGTERM).
      # `--all-features --all-targets` builds every oracle at once, so this job is the worst case.
      # Capping the outer factor bounds peak memory; the inner `--parallel` still uses the cores.
      # sccache does not relax this: it makes each compile cheap, not fewer of them concurrent.
      CARGO_BUILD_JOBS: 2
      # See the sccache rationale above the `jobs:` key.
      SCCACHE_GHA_ENABLED: "true"
      CC: sccache gcc
      CXX: sccache g++
    steps:
      - uses: actions/checkout@v5
        with:
          # The cross-check tests link the vendored codecs in these submodules. `aom`/`dav1d`
          # are `update = none` and arrive via the explicit fetch step below, not this checkout.
          submodules: recursive
      - name: Install system build deps (pkg-config; nasm is vendored, rest via mise)
        # The runner image ships third-party apt sources this project does not consume: today
        # Google Chrome's serves a `Packages.gz` whose hash does not match its index, and
        # Microsoft's breaks periodically. `apt-get update` exits 100 when *any* source fails,
        # which aborted this step and left every later step without sccache (issue #517).
        # So drop the entries we do not use, then update and install unmasked -- a real failure
        # of the Ubuntu archive, or of the packages themselves, still fails the job.
        #
        # Classification is per source *entry* -- a `deb`/`deb-src` line, or a deb822 stanza --
        # rather than per file, so a comment naming an Ubuntu host cannot rescue a third-party
        # list, and a file carrying both an Ubuntu and a third-party stanza is rewritten rather
        # than kept whole. An entry is Ubuntu's if its URI names this image's mirrorlist
        # (`mirror+file:/etc/apt/apt-mirrors.txt`, resolving to azure.archive.ubuntu.com) or an
        # `*.ubuntu.com` host; matching content rather than filenames keeps this correct
        # wherever the entries live, `sources.list` or `sources.list.d/*.sources`.
        #
        # Sources are read through `sudo`, and awk's own failures are kept distinct from "no
        # Ubuntu entry in this file", so a source that cannot be read is never guessed to be
        # third-party and deleted. Nothing is modified until every file has been classified.
        run: |
          # Print an apt source file with only Ubuntu's own entries; exit 10 if it had none.
          prune='
          function ok(u) { u = tolower(u); return u ~ /apt-mirrors\.txt/ || u ~ /\/\/[a-z0-9._-]+\.ubuntu\.com/ }
          function flush(  i) {
            if (n == 0) return
            if (uri == "" || ok(uri)) { for (i = 0; i < n; i++) print s[i]; if (uri != "") keep++ } else drop++
            n = 0; uri = ""
          }
          /^[ \t]*(deb|deb-src)[ \t]/ { flush(); if (ok($0)) { print; keep++ } else drop++; next }
          /^[ \t]*$/ { flush(); print; next }
          /^[ \t]*URIs:/ { uri = $0 }
          { s[n++] = $0 }
          END { flush(); exit (keep > 0 ? 0 : 10) }'
          work=$(mktemp -d)
          ubuntu=0
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            out="$work/$(echo "$f" | tr / _)"
            rc=0
            sudo awk "$prune" "$f" > "$out" || rc=$?
            case "$rc" in
              0) ubuntu=$((ubuntu + 1)) ;;
              10) ;;
              *) echo "::error::could not read or classify $f (awk exit $rc); not guessing at it"
                 exit 1 ;;
            esac
            echo "$rc" > "$out.rc"
          done
          if [ "$ubuntu" -eq 0 ]; then
            # Classification recognised nothing as Ubuntu's -- a re-hosted archive, a renamed mirrorlist.
            # Prune nothing and carry on: that is exactly how this step behaved before the guard existed,
            # whereas failing here would turn one runner-image change into a total outage across every
            # job. A genuinely unreachable archive, or a missing package, still fails loudly at the
            # unmasked `update`/`install` below.
            echo "::warning::no Ubuntu apt source recognised; standing down and leaving sources as they are"
          else
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] || continue
              out="$work/$(echo "$f" | tr / _)"
              if [ "$(cat "$out.rc")" = 10 ]; then
                echo "removing third-party source $f"
                sudo rm -f "$f"
              elif sudo cmp -s "$out" "$f"; then
                echo "keeping $f"
              else
                echo "dropping third-party entries from $f"
                sudo rm -f "$f"
                sudo cp "$out" "$f"
              fi
            done
          fi
          sudo apt-get update
          sudo apt-get install -y pkg-config
      - uses: jdx/mise-action@v4
        with:
          install_args: cmake ninja meson
      # `aom`/`dav1d` are `update = none` in `.gitmodules` (issue #378), so the `recursive`
      # checkout above deliberately skips them; this job builds the AV1/AVIF oracles, so it
      # pulls them explicitly. Every other submodule still arrives with the checkout.
      - name: Fetch the AV1 oracle submodules
        run: mise run fetch-av1-oracles
      - name: Clear pre-installed Rust toolchain
        # The runner image bakes in a `stable` toolchain that rustup can leave "partially
        # installed"; dtolnay/rust-toolchain then does an in-place reinstall that aborts with
        # `detected conflict: 'bin/cargo-fmt'` (CI run 28500539585). Removing it first makes
        # the install below start from a clean slate. Idempotent: a no-op if it is absent.
        run: rustup toolchain uninstall stable || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.10
      # Cache target/ and the cargo registry for the Rust half; sccache (above) covers the native
      # half, which rust-cache structurally cannot. Precedent: mutants.yml. (Same as coverage.)
      - uses: Swatinem/rust-cache@v2
      # cbindgen is a `cargo:` mise tool, so it needs a working cargo — which the runner's
      # baked-in `stable` toolchain is not (see the uninstall step above: rustup reports
      # "the 'cargo' binary … is not applicable to the 'stable-…' toolchain"). Installing it
      # in the mise-action step above therefore fails before the real toolchain exists, so
      # it is installed here instead, after dtolnay/rust-toolchain and the cargo cache.
      - name: Install cbindgen (needs the rustup toolchain installed above)
        run: mise install cargo:cbindgen
      # Clippy and the doctests go through the shared mise tasks (single source of truth with the
      # git hooks). The full test suite is NOT run here — the coverage job runs it instrumented and
      # fails on any test failure, so it is the green-test gate; `test-doc` adds back only the
      # doctests, which `cargo llvm-cov` cannot instrument on stable.
      - name: Clippy
        run: mise run lint
      # `mise run lint` cannot reach the real-camera DNG conformance tier: it is excluded from the
      # workspace and nothing depends on it, so no workspace command compiles it, and a gamut-dng
      # API change breaks it unnoticed until the extended run on master. Its expensive half — the
      # Adobe DNG SDK — is already built by this job for gamut-dng's own dev-dependency on
      # `gamut-dng-oracle`, so what is added here is the tier's own Rust targets. `check` needs no
      # corpus, so this job does not grow the ~178 MiB fetch that `test-dng-real` requires.
      - name: Real-DNG conformance tier compiles
        run: mise run check-dng-real
      - name: gamut-ffi feature sync
        run: mise run check-ffi-features
      - name: gamut-ffi header sync
        run: mise run check-ffi-header
      - name: gamut-ffi seam manifest
        run: mise run check-ffi-seams
      - name: Doctests
        run: mise run test-doc
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  coverage:
    name: Coverage (test gate)
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
      # Same jobs × cores OOM as the lint job above: this one also builds every C++ oracle
      # (`--workspace --all-features`), and instrumented builds are heavier still.
      CARGO_BUILD_JOBS: 2
      # See the sccache rationale above the `jobs:` key.
      SCCACHE_GHA_ENABLED: "true"
      CC: sccache gcc
      CXX: sccache g++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install system build deps (pkg-config; nasm is vendored, rest via mise)
        # Same third-party apt-source guard as ci.yml's `lint` job (issue #517): a broken
        # Chrome/Microsoft source on the runner image makes `apt-get update` exit 100, so drop
        # the entries this project does not consume, then update and install unmasked. Full
        # rationale, and why classification is per source entry, is in ci.yml.
        run: |
          # Print an apt source file with only Ubuntu's own entries; exit 10 if it had none.
          prune='
          function ok(u) { u = tolower(u); return u ~ /apt-mirrors\.txt/ || u ~ /\/\/[a-z0-9._-]+\.ubuntu\.com/ }
          function flush(  i) {
            if (n == 0) return
            if (uri == "" || ok(uri)) { for (i = 0; i < n; i++) print s[i]; if (uri != "") keep++ } else drop++
            n = 0; uri = ""
          }
          /^[ \t]*(deb|deb-src)[ \t]/ { flush(); if (ok($0)) { print; keep++ } else drop++; next }
          /^[ \t]*$/ { flush(); print; next }
          /^[ \t]*URIs:/ { uri = $0 }
          { s[n++] = $0 }
          END { flush(); exit (keep > 0 ? 0 : 10) }'
          work=$(mktemp -d)
          ubuntu=0
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            out="$work/$(echo "$f" | tr / _)"
            rc=0
            sudo awk "$prune" "$f" > "$out" || rc=$?
            case "$rc" in
              0) ubuntu=$((ubuntu + 1)) ;;
              10) ;;
              *) echo "::error::could not read or classify $f (awk exit $rc); not guessing at it"
                 exit 1 ;;
            esac
            echo "$rc" > "$out.rc"
          done
          if [ "$ubuntu" -eq 0 ]; then
            # Classification recognised nothing as Ubuntu's -- a re-hosted archive, a renamed mirrorlist.
            # Prune nothing and carry on: that is exactly how this step behaved before the guard existed,
            # whereas failing here would turn one runner-image change into a total outage across every
            # job. A genuinely unreachable archive, or a missing package, still fails loudly at the
            # unmasked `update`/`install` below.
            echo "::warning::no Ubuntu apt source recognised; standing down and leaving sources as they are"
          else
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] || continue
              out="$work/$(echo "$f" | tr / _)"
              if [ "$(cat "$out.rc")" = 10 ]; then
                echo "removing third-party source $f"
                sudo rm -f "$f"
              elif sudo cmp -s "$out" "$f"; then
                echo "keeping $f"
              else
                echo "dropping third-party entries from $f"
                sudo rm -f "$f"
                sudo cp "$out" "$f"
              fi
            done
          fi
          sudo apt-get update
          sudo apt-get install -y pkg-config
      - uses: jdx/mise-action@v4
        with:
          install_args: cmake ninja meson aqua:taiki-e/cargo-llvm-cov
      # `aom`/`dav1d` are `update = none` in `.gitmodules` (issue #378), so the `recursive`
      # checkout above deliberately skips them; this job builds the AV1/AVIF oracles, so it
      # pulls them explicitly. Every other submodule still arrives with the checkout.
      - name: Fetch the AV1 oracle submodules
        run: mise run fetch-av1-oracles
      - name: Clear pre-installed Rust toolchain
        # Same rustup `bin/cargo-fmt` conflict guard as the lint job above.
        run: rustup toolchain uninstall stable || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      # This is the workspace's test gate as well as its coverage gate: llvm-cov runs the same
      # suite `cargo test` would and fails the job on any test failure. The invocation lives in
      # mise.toml so the exclusion regex and the 80% threshold are not duplicated here.
      - name: Generate coverage report
        run: mise run coverage-lcov
      - name: Generate coverage summary
        run: cargo llvm-cov report --summary-only
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: lcov.info
