name: Extended

# Extended, dependency-heavier portability checks that back the README's cross-compile and MSRV
# claims. Deliberately NOT run on pull_request: they compile the whole shipped library surface
# across several targets/toolchains. They run post-merge on master and can be started by hand on
# any branch (Actions → Extended → Run workflow), so contributors gate locally with
# `mise run check-cross <triple>` / `mise run check-msrv` before merging.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  cross:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1:1 with the README's "wasm32 / aarch64 / musl" cross-compile claims, plus the
        # emscripten row: a pure `cargo check` (SKIP_NATIVE, no emsdk) that catches rot in the
        # encoder's `any(not(wasm32), emscripten)` cfg gates; the real emsdk build+test runs in
        # the `wasm-encoder` job below.
        target:
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v5
        # No submodules: the check is pure Rust (`cargo check`, no test targets), so it never
        # builds the vendored C oracles under third_party/.
      - uses: jdx/mise-action@v4
        with:
          # Only put `mise` on PATH; do NOT build every [tools] entry (convco/cargo-mutants/
          # cmake/ninja/meson) from source — this job needs none of them, just rustup + cargo.
          install: false
      - name: Clear pre-installed Rust toolchain
        # Same rustup `bin/cargo-fmt` reinstall-conflict guard as ci.yml's check job.
        run: rustup toolchain uninstall stable || true
      - uses: dtolnay/rust-toolchain@stable
        # Target install is owned by the `check-cross` mise task (`rustup target add`), so local
        # and CI run the exact same command.
      - name: Cross-compile check
        # `install: false` above only skips the mise-action setup install; `mise run` would still
        # auto-build every [tools] entry (convco/cargo-edit/cargo-mutants from source, plus cmake/
        # ninja/meson) before the task. check-cross needs none of them — only rustup + cargo — and
        # that source build is slow and intermittently times out fetching from crates.io, so disable
        # task auto-install to honor the comment above.
        env:
          MISE_TASK_RUN_AUTO_INSTALL: false
        run: mise run check-cross ${{ matrix.target }}

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: MSRV compile check
        # The task reads the MSRV from Cargo.toml, asserts the README documents it, installs that
        # toolchain, and `cargo +<msrv> check`s the libraries. No version is hardcoded here.
        #
        # `mise run` would otherwise auto-build every [tools] entry (convco/cargo-edit/cargo-mutants
        # from source, plus cmake/ninja/meson) before the task — none of which check-msrv touches; it
        # uses only the runner's rustup + cargo. That source build is slow and intermittently fails,
        # so disable task auto-install to match the `install: false` above.
        env:
          MISE_TASK_RUN_AUTO_INSTALL: false
        run: mise run check-msrv

  # The JPEG XL encoder on WebAssembly, for real: builds libjxl with the emsdk toolchain and runs
  # the gamut-jxl-sys + gamut-jxl test suites (including the libjxl-oracle differential tests) on
  # wasm32-unknown-emscripten under node. Backs the README claim that JXL encode works on the
  # emscripten target; wasm32-unknown-unknown stays decode-only (no C/C++ toolchain targets it).
  wasm-encoder:
    name: JXL encoder on wasm32-unknown-emscripten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # No submodules: only libjxl (vendored by the jpegxl-src crate) is built here, never the
        # third_party/ C oracles.
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: mymindstorm/setup-emsdk@v14
        with:
          # rustc's own CI builds this target's std with `emsdk install latest`, so any recent
          # emsdk matches; too-old emsdks fail at link time (3.1.68's wasm-opt predates the
          # `--enable-bulk-memory-opt` flag rustc 1.97 emits). 6.0.2 is the verified pin — bump
          # it together with toolchain updates rather than floating `latest` in CI.
          version: 6.0.2
          actions-cache-folder: emsdk-cache
      - name: Clear pre-installed Rust toolchain
        # Same rustup `bin/cargo-fmt` reinstall-conflict guard as ci.yml's check job.
        run: rustup toolchain uninstall stable || true
      - uses: dtolnay/rust-toolchain@stable
      # Cache the emscripten libjxl cmake build (~3-6 min cold) exactly like ci.yml caches the
      # native one.
      - uses: Swatinem/rust-cache@v2
      - name: Build and run the JXL tests under node
        run: mise run test-jxl-wasm

  # Real camera DNGs (issue #174). The corpus lives in the `gamut-dng-samples` submodule — ~178 MiB
  # of CC0 files written by actual cameras — and is marked `update = none` in .gitmodules so no
  # other job or contributor checkout pays for it; this job fetches it explicitly. It also builds
  # the Adobe DNG SDK oracle and libjxl for the differential, which is why it is a slow, off-PR
  # lane rather than part of the coverage gate. Gate locally with `mise run test-dng-real`.
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # One target's crash says nothing about another's, so a failure must not cancel the rest.
      fail-fast: false
      matrix:
        # One entry per file in tooling/gamut-fuzz/fuzz_targets. A matrix rather than three steps
        # in one job, so each target gets the full time budget below in parallel instead of the
        # job's wall time growing with every crate that gains laws.
        target: [ifd_read_ledger, core_convert, tonemap_curves]
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          # Only put `mise` on PATH; do NOT build every `[tools]` entry. This job needs exactly
          # one of them, and the default behaviour is what broke its first run: mise tried to
          # build cargo-edit, cargo-fuzz, cargo-mutants and convco *before* the toolchain steps
          # below, against the runner's baked-in half-installed `stable`, and reported
          # "Failed to install tools: ... cargo exited with non-zero status: exit code 1".
          # Same `install: false` the `cross` job above uses, for the same reason.
          install: false
      - name: Clear pre-installed Rust toolchain
        # Same rustup `bin/cargo-fmt` conflict guard as the jobs above.
        run: rustup toolchain uninstall stable || true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nightly for libFuzzer
        # libFuzzer needs `-Z sanitizer=fuzzer`, which stable does not expose. The workspace pins
        # stable in rust-toolchain.toml; `mise run fuzz` selects nightly for the excluded
        # `tooling/gamut-fuzz` crate only, the same shape as `mise run fmt` selecting a nightly
        # rustfmt. The runner also pins `--target` to the host gnu triple, because cargo-fuzz
        # defaults to musl and the sanitizer cannot link a static libc.
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz (needs the rustup toolchain installed above)
        # cargo-fuzz is a `cargo:` mise tool, so installing it needs a working cargo -- which is
        # why it cannot go in the mise-action step above, which runs before one exists. Exactly
        # the ordering ci.yml's lint job documents for cbindgen. `MISE_TASK_RUN_AUTO_INSTALL` is
        # false for this job, so `mise run fuzz` below will not silently reinstall it either.
        run: mise install cargo:cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        # Time-bounded so the job terminates: this tier is unbounded by nature, which is exactly
        # why it is here and not in the per-PR `coverage` gate (see docs/testing.md). Ten minutes
        # buys roughly 5-6 million executions at the throughput measured locally (~9k/s).
        #
        # A crash found here is minimised and promoted into a NAMED DETERMINISTIC TEST in the
        # crate's own suite -- the corpus is a search aid, not the regression record -- so a
        # failure of this job is a signal to go and write that test, not to re-run until green.
        run: mise run fuzz ${{ matrix.target }} -- -max_total_time=600
      - name: Upload any crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: tooling/gamut-fuzz/artifacts/
          if-no-files-found: ignore

  benches:
    name: Benches still run
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
      # Same cap and rationale as ci.yml's lint job: the vendored C/C++ oracles build via
      # `cmake --build --parallel`, which does not join cargo's jobserver, so the concurrent
      # compiler count is jobs x cores rather than jobs. This job builds them in release.
      CARGO_BUILD_JOBS: 2
      SCCACHE_GHA_ENABLED: "true"
      CC: sccache gcc
      CXX: sccache g++
    steps:
      - uses: actions/checkout@v5
        with:
          # The bench crates dev-depend on the oracle crates, so their release build links the
          # vendored codecs. `aom`/`dav1d` are `update = none` and arrive via the fetch below.
          submodules: recursive
      - name: Install system build deps (pkg-config; nasm is vendored, rest via mise)
        # Same third-party apt-source guard as ci.yml's `lint` job (issue #517): a broken
        # Chrome/Microsoft source on the runner image makes `apt-get update` exit 100, so drop
        # the sources this project does not consume, then update and install unmasked. Full
        # rationale, and why Ubuntu's own sources are matched by content, is in ci.yml.
        run: |
          kept=0
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            if grep -Eq 'apt-mirrors\.txt|//[a-z0-9.-]*\.ubuntu\.com' "$f"; then
              kept=$((kept + 1))
              echo "keeping $f"
            else
              echo "removing third-party source $f"
              sudo rm -f "$f"
            fi
          done
          if [ "$kept" -eq 0 ]; then
            echo "::error::no Ubuntu apt source survived pruning; refusing to install from a stale index"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y pkg-config
      - uses: jdx/mise-action@v4
        with:
          install_args: cmake ninja meson
      - name: Fetch the AV1 oracle submodules
        run: mise run fetch-av1-oracles
      - name: Clear pre-installed Rust toolchain
        # Same rustup `bin/cargo-fmt` conflict guard as the jobs above.
        run: rustup toolchain uninstall stable || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Run every bench once
        # Not a performance measurement: Divan's `--test` runs each bench a single time to prove it
        # still executes. Compile rot is already caught on every PR by `mise run lint`
        # (`--all-targets` includes `--benches`); what was ungated was a bench that *builds* and
        # then panics in setup.
        #
        # Here rather than in the `fast` lane because the bench crates dev-depend on the native
        # oracles -- lcms2, libaom, libavif, the DNG SDK, libtiff -- so this pulls in all fourteen
        # vendored C/C++ projects, in release. `fast` deliberately installs no CMake.
        run: mise run bench-test
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  real-dng:
    name: Real camera DNG conformance
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: false
      # Same jobs x cores OOM guard as ci.yml's oracle-building lanes.
      CARGO_BUILD_JOBS: 2
      SCCACHE_GHA_ENABLED: "true"
      CC: sccache gcc
      CXX: sccache g++
    steps:
      - uses: actions/checkout@v5
        with:
          # `recursive` honours `update = none`, so the samples submodule is NOT fetched here;
          # the explicit step below is what pulls it. The C oracles under third_party/ are.
          submodules: recursive
      - name: Install system build deps (pkg-config; nasm is vendored, rest via mise)
        # Same third-party apt-source guard as ci.yml's `lint` job (issue #517): a broken
        # Chrome/Microsoft source on the runner image makes `apt-get update` exit 100, so drop
        # the sources this project does not consume, then update and install unmasked. Full
        # rationale, and why Ubuntu's own sources are matched by content, is in ci.yml.
        run: |
          kept=0
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            if grep -Eq 'apt-mirrors\.txt|//[a-z0-9.-]*\.ubuntu\.com' "$f"; then
              kept=$((kept + 1))
              echo "keeping $f"
            else
              echo "removing third-party source $f"
              sudo rm -f "$f"
            fi
          done
          if [ "$kept" -eq 0 ]; then
            echo "::error::no Ubuntu apt source survived pruning; refusing to install from a stale index"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y pkg-config
      - uses: jdx/mise-action@v4
        with:
          install_args: cmake ninja meson
      - name: Clear pre-installed Rust toolchain
        # Same rustup `bin/cargo-fmt` conflict guard as ci.yml's lint job.
        run: rustup toolchain uninstall stable || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the real-camera DNG corpus
        run: mise run fetch-dng-samples
      - name: Validate gamut-dng against real camera DNGs
        run: mise run test-dng-real
      - name: sccache stats
        if: always()
        run: sccache --show-stats
