[package]
name = "gamut-tonemap"
description = "Tone-mapping math primitives: built-in tone curves plus an extensible trait for custom operators."
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Exposes the `invariants` module to the out-of-tree fuzz driver. `doc(hidden)`, no SemVer
# guarantee, and never enabled by the `gamut` umbrella; the crate's own tests get it via `cfg(test)`.
test-support = []

[dependencies]
gamut-core.workspace = true

[dev-dependencies]
divan.workspace = true
proptest.workspace = true

[[bench]]
name = "tonemap"
harness = false
