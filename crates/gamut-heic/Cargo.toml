[package]
name = "gamut-heic"
description = "HEIC still-image decoder: the HEVC binding over gamut-heif's shared HEIF layer, with pluggable HEVC codestream-decoder backends."
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The shared backend `Registry` (behind its `std` feature) `HeifDecoder` runs its HEVC backends
# through, and the `Decoder` seam `AbiHevcDecoder` adapts.
gamut-codec-abi = { workspace = true, features = ["std"] }
gamut-core.workspace = true
gamut-color.workspace = true
# The `ue(v)` reader the SPS walk sizes `AbiHevcDecoder`'s output planes with.
gamut-bitstream.workspace = true
gamut-isobmff.workspace = true
# The shared HEIF/MIAF layer: the item model, the derivation walk, the decode limits, the RGBA
# presentation and the C2PA summary, which this crate binds HEVC into (issue #1086).
gamut-heif.workspace = true
# Typed metadata (issue #420): the facade types that parse the `RawMetadata` `HeifDecoder::metadata`
# returns. Optional and off by default, and a *normal* dependency (never dev-only) so release
# ordering follows it (`mise run check-release-deps`).
gamut-metadata = { workspace = true, optional = true }

[features]
default = []
# Typed metadata wiring: re-exports the `gamut-metadata` facade's `TypedMetadata`, which parses the
# `RawMetadata` `HeifDecoder::metadata` returns (that method itself is always available).
metadata = ["dep:gamut-metadata"]

[dev-dependencies]
# libheif (+ libde265 decode, kvazaar encode) as the differential-conformance oracle: FFI to a
# vendored, statically-linked HEIF stack built from the `third_party/{libheif,libde265,kvazaar}`
# submodules. Dev-only: the shipped library is pure Rust and C-free. Building these tests requires
# cmake/ninja and a C/C++ toolchain plus the checked-out submodules
# (`git submodule update --init --recursive`).
libheif-oracle = { path = "../../tooling/libheif-oracle" }
