[package]
name = "gamut-webp"
description = "WebP image encoder and decoder (intra-frame VP8/VP8L still images in a RIFF container)."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-codec-abi.workspace = true
gamut-core.workspace = true
gamut-color.workspace = true
gamut-dsp.workspace = true
gamut-riff.workspace = true
# Typed metadata (issue #510): the unified `Metadata` model over the raw `EXIF` / `XMP ` / `ICCP` /
# `C2PA` chunks this crate locates and writes. Optional and off by default — a plain WebP consumer
# pays for none of the four metadata crates — and a *normal* dependency (never dev-only), so
# release ordering follows it (`mise run check-release-deps`).
gamut-metadata = { workspace = true, optional = true }

[features]
default = []
# Typed metadata wiring: `WebpMetadata::blocks` / `WebpMetadata::metadata` (the facade's
# `TypedMetadata` trait) and `WebpEncoder::with_metadata` / `with_encoded_metadata`.
metadata = ["dep:gamut-metadata"]

[dev-dependencies]
# libwebp as the differential-test oracle (FFI). Dev-only: the shipped library is C-free.
libwebp-sys2.workspace = true
# Used by the lossy oracle tests to build YUV inputs and wrap raw VP8 bitstreams.
gamut-color.workspace = true
gamut-riff.workspace = true
divan.workspace = true

[[bench]]
name = "codec"
harness = false
