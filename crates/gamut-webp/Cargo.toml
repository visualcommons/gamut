[package]
name = "gamut-webp"
description = "WebP image encoder and decoder (intra-frame VP8/VP8L still images in a RIFF container)."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-codec-abi = { workspace = true, features = ["std"] }
gamut-core.workspace = true
gamut-color.workspace = true
gamut-dsp.workspace = true
gamut-riff.workspace = true
# Typed metadata (issue #510): the unified `Metadata` model over the raw `EXIF` / `XMP ` / `ICCP` /
# `C2PA` chunks this crate locates and writes. Optional and off by default — a plain WebP consumer
# pays for none of the four metadata crates — and a *normal* dependency (never dev-only), so
# release ordering follows it (`mise run check-release-deps`).
gamut-metadata = { workspace = true, optional = true }

[features]
default = []
# Typed metadata wiring: `WebpEncoder` becomes a `gamut_metadata::MetadataSink`
# (`with_metadata` / `with_encoded_metadata`), and the facade's `TypedMetadata` reads the
# `RawMetadata` that `WebpDecoder::metadata` returns.
metadata = ["dep:gamut-metadata"]

[dev-dependencies]
# libwebp as the differential-test oracle, through safe wrappers that own the FFI `unsafe` this
# crate forbids — so the inline `vp8::frame` tests can call it too. Dev-only, excluded from the
# workspace; see tooling/libwebp-oracle. The shipped library is C-free.
libwebp-oracle = { path = "../../tooling/libwebp-oracle" }
divan.workspace = true
# exiv2 as the container-level metadata oracle (FFI to a vendored, statically-linked exiv2 built
# from the `third_party/exiv2` + `third_party/expat` submodules): it reads what the `metadata`
# feature embeds and writes what its reader is checked against. Dev-only, excluded from the
# workspace; see tooling/exiv2-oracle.
exiv2-oracle = { path = "../../tooling/exiv2-oracle" }

[[bench]]
name = "codec"
harness = false
