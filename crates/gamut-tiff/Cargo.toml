[package]
name = "gamut-tiff"
description = "TIFF 6.0 (Tagged Image File Format) image encoder and decoder."
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-core.workspace = true
gamut-bitstream.workspace = true
# Adobe Deflate (`Compression = 8`) encode uses the shared space-optimising zlib encoder; decode
# uses the same bounded, pure-Rust inflater as gamut-png.
gamut-deflate.workspace = true
miniz_oxide = "0.8"
# The IFD container core (byte order, field types, IFD chain, two-pass offset writer). `bigtiff`
# enables the 64-bit BigTIFF variant the codec writes/reads.
gamut-ifd = { workspace = true, features = ["bigtiff"] }
# Typed metadata (issue #510): the unified `Metadata` model over the `ExifIFD` directory and the
# XMP / IPTC-IIM / ICC / C2PA payloads `TiffMetadata` carries. Optional and off by default, and a
# *normal* dependency (never dev-only), so release ordering follows it
# (`mise run check-release-deps`).
gamut-metadata = { workspace = true, optional = true }

[features]
default = []
# Typed metadata wiring: `TiffMetadata`'s `TypedMetadata` impl (`blocks` / `metadata`) and
# `TiffEncoder::with_typed_metadata` / `with_encoded_metadata` over the `gamut-metadata` facade.
metadata = ["dep:gamut-metadata"]

[dev-dependencies]
# Differential cross-check oracle: a vendored, statically-linked libtiff (built from the
# `third_party/libtiff` submodule). Dev-only and excluded from the workspace.
libtiff-oracle = { path = "../../tooling/libtiff-oracle" }
# exiv2 as the container-level metadata oracle (FFI to a vendored, statically-linked exiv2 built
# from the `third_party/exiv2` + `third_party/expat` submodules): it reads what the `metadata`
# feature embeds and writes what its reader is checked against. Dev-only, excluded from the
# workspace; see tooling/exiv2-oracle.
exiv2-oracle = { path = "../../tooling/exiv2-oracle" }
divan.workspace = true

[[bench]]
name = "codec"
harness = false
