[package]
name = "gamut-color"
description = "Color primitives for gamut: CICP code points, coded-plane bit depth and chroma subsampling, 8- and 10/12-bit (including monochrome) planar buffers, BT.601 YCbCr 4:2:0, and f64 colour science (encoder-exact transfers, OKLab, gamut mapping)."
version = "3.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde", "gamut-core/serde"]
# Exposes the `invariants` module to the out-of-tree fuzz driver. `doc(hidden)`, no SemVer
# guarantee, and never enabled by the `gamut` umbrella; the crate's own tests get it via `cfg(test)`.
test-support = []

[dependencies]
gamut-core.workspace = true
# The reference chroma upsampling kernels `Planar8::to_rgb8_bt601` runs, and the pixel clamps.
gamut-dsp.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
divan.workspace = true
proptest.workspace = true
serde_json.workspace = true
# Differential oracle: a vendored, statically-linked Little-CMS (lcms2). Dev-only and excluded
# from the workspace, so a plain `cargo build` of this crate never needs a C toolchain; the
# conformance tests do (`git submodule update --init` + a C compiler + libclang).
lcms2-oracle = { path = "../../tooling/lcms2-oracle" }

[[bench]]
name = "color"
harness = false
