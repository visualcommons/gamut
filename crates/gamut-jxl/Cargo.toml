[package]
name = "gamut-jxl"
description = "JPEG XL image encoder and decoder."
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The shared codestream-backend seam (issue #272): the `repr(C)` vtables and their Rust twin traits
# that `crate::abi` adapts onto gamut-jxl's typed `JxlCodestreamEncoder`/`JxlCodestreamDecoder`.
# Unconditional and feature-independent: the seam is pure interface (no_std, dependency-free), and
# pushing a backend is exactly what supplies a direction whose built-in tail is compiled out.
gamut-codec-abi.workspace = true
gamut-core.workspace = true

# The pure-Rust JPEG XL decoder (jxl-rs). Not target-gated: it is 100% safe Rust and compiles for
# every target, wasm32 included, so the `decode` feature works even where the native encoder cannot
# build.
jxl = { workspace = true, optional = true }

# Typed metadata (issue #420): the unified `Metadata` model over the `Exif` / `xml ` boxes and the
# codestream ICC profile this crate writes and reads. Optional and off by default, and a *normal*
# dependency (never dev-only) so release ordering follows it (`mise run check-release-deps`).
gamut-metadata = { workspace = true, optional = true }

# The libjxl-backed encoder. Target-conditional optional dep (the `getrandom` pattern), present on
# every encoder-capable target: everything except wasm32 *without* emscripten. On
# `wasm32-unknown-emscripten` gamut-jxl-sys builds libjxl with the emsdk toolchain, so the full
# encoder works there; on `wasm32-unknown-unknown`/`wasm32-wasip*` no C++ toolchain targets the ABI,
# so the dep — and therefore the whole encoder — is compiled out (decode-only). The same condition
# guards every encoder `#[cfg]` in src/ and tests/.
[target.'cfg(any(not(target_arch = "wasm32"), target_os = "emscripten"))'.dependencies]
gamut-jxl-sys = { workspace = true, optional = true }

# The oracle for the encoder tests: the same static libjxl archive also exposes a decode surface,
# which the integration tests use to read encoded streams back. Available exactly where the encoder
# is (see above), including emscripten — the wasm test lane runs the full differential suite.
[target.'cfg(any(not(target_arch = "wasm32"), target_os = "emscripten"))'.dev-dependencies]
gamut-jxl-sys.workspace = true

[features]
default = ["decode", "encode"]
# Wraps the reference libjxl (via `gamut-jxl-sys`) to encode JPEG XL. On wasm32 targets other than
# emscripten the underlying target-conditional dep is absent, so enabling `encode` is inert there
# (it pulls in nothing and gates out the encoder modules) rather than a build error.
encode = ["dep:gamut-jxl-sys"]
# The pure-Rust JPEG XL decoder wrapping the `jxl` crate (jxl-rs). Pure safe Rust with no native
# build, so — unlike `encode` — it is available on every target, wasm32 included.
decode = ["dep:jxl"]
# Typed metadata wiring: `JxlMetadata::blocks` / `JxlMetadata::metadata` and
# `JxlEncoder::with_metadata` / `with_encoded_metadata` over the `gamut-metadata` facade. Pure Rust,
# target-independent; reading the boxes back (`JxlDecoder::metadata`) needs `decode`.
metadata = ["dep:gamut-metadata"]
