[package]
name = "gamut-icc"
description = "ICC color profile (ICC.1:2022) parser and serializer — header, tag table, and tag element types — for gamut image metadata."
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-core.workspace = true
md-5.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Differential oracle: a vendored, statically-linked Little-CMS (lcms2). Dev-only and excluded
# from the workspace, so a plain `cargo build` of this crate never needs a C toolchain; the
# conformance tests do (`git submodule update --init` + a C compiler + libclang).
lcms2-oracle = { path = "../../tooling/lcms2-oracle" }
