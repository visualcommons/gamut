[package]
name = "gamut-ifd"
description = "TIFF Image File Directory (IFD) container core — byte order, field types, and IFD read/write — shared by the TIFF codec and EXIF metadata."
version = "3.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
# BigTIFF (`references/tiff/bigtiff.html`): 64-bit offsets/counts and the `Long8`/`SLong8`/`Ifd8`
# field types. Additive — off by default so classic-only consumers (e.g. gamut-exif) stay lean;
# gamut-tiff enables it. See `STATUS.md` (P8).
bigtiff = []
# Exposes `invariants` — the crate's executable laws — to an out-of-tree fuzz driver. Additive,
# off by default, and deliberately NOT re-exported by the `gamut` umbrella, so the shipped
# surface and `check-ffi-features` are unaffected. The crate's own tests get the module without
# it (`#[cfg(any(test, feature = "test-support"))]`). The module is `doc(hidden)` and carries no
# SemVer guarantee — it is gamut's own harness, not API to pin. See `docs/testing.md`.
test-support = []

[dependencies]
gamut-core.workspace = true

[dev-dependencies]
divan.workspace = true
# Property testing (issue #240). Drives the `invariants` laws with a PINNED seed — see
# `docs/testing.md`: the `--in-diff` mutation gate is blocking, so a test whose pass/fail depends
# on OS entropy would make CAUGHT/MISSED vary run to run.
proptest.workspace = true

[[bench]]
name = "ifd"
harness = false
