[package]
name = "gamut-exif"
description = "EXIF (Exif 3.0 / CIPA DC-008) image metadata parser and serializer, built on the shared TIFF/IFD core."
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
full = ["describe", "geocoordinates"]
# Human-readable descriptions of the enumerated tag values (CIPA DC-008's own wording). Off by
# default: several kilobytes of static strings that a consumer which only writes metadata, or only
# round-trips it, never reads. Pure data — no dependency.
describe = []
geocoordinates = ["dep:geocoordinates"]

[dependencies]
gamut-core.workspace = true
gamut-ifd.workspace = true
geocoordinates = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# Differential conformance oracle: a vendored, statically-linked exiv2 exercising its EXIF
# parser/serializer. Requires the third_party/exiv2 + third_party/expat submodules and a C++
# toolchain; see tooling/exiv2-oracle.
exiv2-oracle = { path = "../../tooling/exiv2-oracle" }
