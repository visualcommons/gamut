[package]
name = "gamut-core"
description = "Core traits, image buffers, dimensions, and error types shared across the gamut image codecs."
version = "2.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
serde = ["dep:serde"]
# Exposes the `invariants` module to the out-of-tree fuzz driver. `doc(hidden)`, no SemVer
# guarantee, and never enabled by the `gamut` umbrella; the crate's own tests get it via `cfg(test)`.
test-support = []

[dependencies]
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
