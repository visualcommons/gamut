[package]
name = "gamut-avif"
description = "Pure-Rust AVIF still-image encoder and container decoder — lossless and lossy AV1 intra frames in an ISOBMFF/MIAF container, with a pluggable AV1 codestream-decoder hook."
version = "3.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# Exposes the `invariants` module to the out-of-tree fuzz driver. `doc(hidden)`, no SemVer
# guarantee, and never enabled by the `gamut` umbrella; the crate's own tests get it via `cfg(test)`.
test-support = []
# Typed metadata wiring: `AvifImage`'s `TypedMetadata` impl (`blocks` / `metadata`) and
# `AvifEncoder::with_metadata` / `with_encoded_metadata` over the `gamut-metadata` facade.
metadata = ["dep:gamut-metadata"]

[dependencies]
gamut-core.workspace = true
gamut-color.workspace = true
gamut-av1.workspace = true
gamut-codec-abi.workspace = true
gamut-isobmff.workspace = true
# Typed metadata (issue #510): the unified `Metadata` model over the `Exif` / XMP items and `colr`
# ICC profile this crate locates and writes. Optional and off by default, and a *normal*
# dependency (never dev-only), so release ordering follows it (`mise run check-release-deps`).
gamut-metadata = { workspace = true, optional = true }

[dev-dependencies]
# libavif as the end-to-end container oracle (FFI to a vendored, statically-linked
# libavif with a vendored dav1d backend). Dev-only: the shipped library is C-free.
# Building these tests requires cmake/meson/ninja/nasm and the `third_party/libavif`
# + `third_party/dav1d` submodules. dav1d is `update = none`, so fetch it with
# `mise run fetch-av1-oracles` (issue #378).
libavif-oracle = { path = "../../tooling/libavif-oracle" }
# dav1d directly (raw OBU stream in, planes out) implements the conformance suite's
# Av1StillDecoder bridge — the exact seam a platform decoder plugs into.
dav1d-oracle = { path = "../../tooling/dav1d-oracle" }
# exiv2 as the container-level metadata oracle (FFI to a vendored, statically-linked exiv2 with
# its BMFF reader, built from the `third_party/exiv2` + `third_party/expat` submodules): it reads
# what the `metadata` feature embeds. Dev-only, excluded from the workspace; see
# tooling/exiv2-oracle.
exiv2-oracle = { path = "../../tooling/exiv2-oracle" }
divan.workspace = true
proptest.workspace = true

[[bench]]
name = "encode"
harness = false
