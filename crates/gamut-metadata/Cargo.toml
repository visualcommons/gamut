[package]
name = "gamut-metadata"
description = "Unified image-metadata facade over gamut's EXIF, XMP, ICC, and IPTC crates — extract from and embed into container metadata blocks."
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Only for `MetadataError::Container`: a format crate's locate failure (its `gamut_core::Error`)
# surfaced through `TypedMetadata::blocks` with its kind and message intact.
gamut-core.workspace = true
gamut-exif.workspace = true
gamut-xmp.workspace = true
gamut-icc.workspace = true
gamut-iptc.workspace = true
thiserror.workspace = true

[features]
default = []
# Forward gamut-exif's `describe` (the enumerated tags' meanings, in CIPA DC-008's wording), so a
# consumer of this facade — or of the `gamut` umbrella — can reach `exif::describe` (issue #543).
exif-describe = ["gamut-exif/describe"]
