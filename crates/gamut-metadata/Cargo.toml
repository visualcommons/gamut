[package]
name = "gamut-metadata"
description = "Unified image-metadata facade over gamut's EXIF, XMP, ICC, and IPTC crates — extract from and embed into container metadata blocks."
version = "3.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The workspace error, in both directions: `MetadataError::Core` carries a format crate's locate
# failure through `TypedMetadata::blocks` intact, `From<MetadataError> for gamut_core::Error`
# funnels the facade's errors out, and `MetadataSink` speaks `gamut_core::Result` to encoders.
gamut-core.workspace = true
gamut-exif.workspace = true
gamut-xmp.workspace = true
gamut-icc.workspace = true
gamut-iptc.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Differential oracle for the EXIF<->XMP mapping: a vendored, statically-linked exiv2 (with its
# bundled Adobe XMP Toolkit) built from the `third_party/exiv2` + `third_party/expat` submodules,
# whose `copyExifToXmp` / `copyXmpToExif` the `exif_xmp` tests compare against. Dev-only,
# unpublished and excluded from the workspace, so it adds no release-ordering edge; needs the
# submodules and a C++ toolchain.
exiv2-oracle = { path = "../../tooling/exiv2-oracle" }

[features]
default = []
# Forward gamut-exif's `describe` (the enumerated tags' meanings, in CIPA DC-008's wording), so a
# consumer of this facade — or of the `gamut` umbrella — can reach `exif::describe` (issue #543).
exif-describe = ["gamut-exif/describe"]
