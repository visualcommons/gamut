[package]
name = "gamut-dng"
description = "DNG (Adobe Digital Negative) 1.7.1 raw-image encoder and decoder."
version = "2.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
# JPEG XL (Compression = 52546) *encoding* via gamut-jxl's libjxl backend (cmake + a C++
# toolchain at build time; inert on wasm32 targets other than emscripten, mirroring gamut-jxl).
# Decoding JPEG XL DNGs is always available — the pure-Rust jxl-rs decode path is a normal
# dependency.
jxl-encode = ["gamut-jxl/encode"]

[dependencies]
gamut-core.workspace = true
# The DNG 1.7.1 §6 white-balance conversion is colour science, not container work: the
# chromaticity → XYZ step, the 3×3 algebra, and the correlated-colour-temperature the
# calibration interpolation weights on all come from the shared colour primitive.
gamut-color.workspace = true
# DNG is a TIFF/EP profile: the IFD container (incl. sub-IFD trees and the BigTIFF variant) is the
# shared gamut-ifd primitive. `bigtiff` is enabled for the DNG 1.7 64-bit-offset variant.
gamut-ifd = { workspace = true, features = ["bigtiff"] }
# Shared MSB-first sample bit-packing for sub-byte depths (10/12/14-bit); see `bitpack`.
gamut-bitstream.workspace = true
# Embedded metadata comes from the workspace facade rather than a DNG-local restatement of it: a
# DNG's `ExifIFD` *is* an EXIF sub-IFD, so `gamut-exif`'s `Exif` (reached through the facade, the
# one entry point format crates consume) models it exactly, over the very same `gamut-ifd`
# directory type this crate already speaks. The XMP/IPTC-IIM/ICC payloads stay verbatim bytes and
# are handed over as the facade's `MetadataBlock`s.
gamut-metadata.workspace = true
# JPEG XL (Compression = 52546, DNG 1.7): decode is the pure-Rust jxl-rs path (wasm-safe, keeps
# the default build C-free); encode is opt-in via the `jxl-encode` feature above.
gamut-jxl = { workspace = true, features = ["decode"] }
# DNG ZIP (Compression = 8, zlib RFC 1950). Encoding uses the workspace's space-optimising zlib
# encoder; bounded inflation delegates the security-sensitive decode surface to `miniz_oxide`,
# which `gamut-deflate` (encoder-only by design) blesses for exactly this. Both are pure Rust, so
# the shipped crate stays C-free.
gamut-deflate.workspace = true
miniz_oxide = "0.8"

[dev-dependencies]
# Authoritative conformance oracle: the headless-built Adobe DNG SDK 1.7.1 (gamut encode →
# dng_validate must accept; its JPEG XL reader is the real libjxl via gamut-jxl-sys). Dev-only;
# statically linked from the committed SDK ZIP.
gamut-dng-oracle = { path = "../../tooling/gamut-dng-oracle" }
# A DNG is a valid TIFF, so libtiff cross-checks the container and the IFD-0 preview pixels.
libtiff-oracle = { path = "../../tooling/libtiff-oracle" }
# Self-dependency enabling `jxl-encode` for the test suite, so the JPEG XL encode ⇄ decode ⇄
# Adobe-oracle round-trips always run (the oracle already builds libjxl, so this adds no cost).
gamut-dng = { path = ".", features = ["jxl-encode"] }
divan.workspace = true

[[bench]]
name = "compression"
harness = false
