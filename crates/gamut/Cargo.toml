[package]
name = "gamut"
description = "Space-efficient image encoding libraries — a unified API over per-format codecs, selected via Cargo features."
version = "0.3.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-core.workspace = true

# Optional format crates, enabled via the features below.
gamut-avif = { workspace = true, optional = true }
# The workspace entry disables default features (so gamut-dng can be decode-only); the umbrella
# re-enables both halves (encode remains target-gated off non-emscripten wasm32 inside gamut-jxl).
gamut-jxl = { workspace = true, optional = true, features = ["decode", "encode"] }
gamut-webp = { workspace = true, optional = true }
gamut-heic = { workspace = true, optional = true }
gamut-vvc = { workspace = true, optional = true }
gamut-av1 = { workspace = true, optional = true }
gamut-av2 = { workspace = true, optional = true }
gamut-tiff = { workspace = true, optional = true }
gamut-dng = { workspace = true, optional = true }
gamut-png = { workspace = true, optional = true }
gamut-jpeg = { workspace = true, optional = true }

# Optional container primitive: the ISOBMFF/HEIF still-image box tree shared by avif/heic,
# re-exported behind the `isobmff` feature so tooling can read/write containers directly.
gamut-isobmff = { workspace = true, optional = true }

# Optional image-metadata primitives (issue #34), re-exported behind the `metadata` feature.
gamut-ifd = { workspace = true, optional = true }
gamut-icc = { workspace = true, optional = true }
gamut-xmp = { workspace = true, optional = true }
gamut-exif = { workspace = true, optional = true }
gamut-iptc = { workspace = true, optional = true }
gamut-metadata = { workspace = true, optional = true }

# Optional ICC colour management module (epic #323), re-exported behind the `cmm` feature: builds
# and applies colour transforms from the profiles gamut-icc parses.
gamut-cmm = { workspace = true, optional = true }

# Optional shared primitives, re-exported behind the `primitives` feature for
# tooling/sandbox use (e.g. gamut-cli); not needed for plain format encoding.
gamut-color = { workspace = true, optional = true }
gamut-dsp = { workspace = true, optional = true }
gamut-bitstream = { workspace = true, optional = true }

# Optional tone-mapping primitives, re-exported behind the `tonemap` feature.
gamut-tonemap = { workspace = true, optional = true }

# Optional codestream-backend seam (issue #272), re-exported behind the `codec-abi` feature so a
# consumer can implement/adapt a codec backend against the same ABI the format crates consume.
gamut-codec-abi = { workspace = true, optional = true }

[features]
default = []
avif = ["dep:gamut-avif", "dep:gamut-av1"]
jxl = ["dep:gamut-jxl"]
webp = ["dep:gamut-webp"]
heic = ["dep:gamut-heic"]
vvc = ["dep:gamut-vvc"]
av1 = ["dep:gamut-av1"]
av2 = ["dep:gamut-av2"]
tiff = ["dep:gamut-tiff"]
dng = ["dep:gamut-dng"]
png = ["dep:gamut-png"]
jpeg = ["dep:gamut-jpeg"]
# Re-export the ISOBMFF/HEIF still-image container primitive for tooling.
isobmff = ["dep:gamut-isobmff"]
# Re-export the shared building blocks (`color`/`dsp`/`bitstream`) for tooling.
primitives = ["dep:gamut-color", "dep:gamut-dsp", "dep:gamut-bitstream"]
tonemap = ["dep:gamut-tonemap"]
# Re-export the shared codestream-backend seam for backend implementors.
codec-abi = ["dep:gamut-codec-abi"]
metadata = [
    "dep:gamut-metadata",
    "dep:gamut-exif",
    "dep:gamut-xmp",
    "dep:gamut-icc",
    "dep:gamut-iptc",
    "dep:gamut-ifd",
]
# The ICC colour management module (transform engine) over gamut-icc profiles.
cmm = ["dep:gamut-cmm"]
all = [
    "avif",
    "jxl",
    "webp",
    "heic",
    "vvc",
    "av1",
    "av2",
    "tiff",
    "dng",
    "png",
    "jpeg",
    "isobmff",
    "metadata",
    "cmm",
    "primitives",
    "tonemap",
    "codec-abi",
]

[dev-dependencies]
# The lcms2 differential oracle for the umbrella's XYB ICC pin (dev-only tooling, not publishable,
# so this edge is invisible to release ordering).
lcms2-oracle = { path = "../../tooling/lcms2-oracle" }

[[test]]
name = "interoperability"
required-features = ["jpeg", "metadata", "primitives", "tonemap", "webp"]

[[test]]
name = "xyb_icc"
required-features = ["jpeg", "metadata", "primitives"]
