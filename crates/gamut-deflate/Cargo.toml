[package]
name = "gamut-deflate"
description = "Pure-Rust DEFLATE (RFC 1951) and zlib (RFC 1950) encoder, tuned for space efficiency."
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# The default build has no dependency at all. `inflate` adds the bounded zlib inflate the
# workspace's decoders share (`inflate_zlib`), delegating the decode itself to the safe, fuzzed
# `miniz_oxide` and reporting failures as `gamut-core` errors under the caller's origin.
[features]
inflate = ["dep:gamut-core", "dep:miniz_oxide"]
# Exposes the `invariants` module (the bounded-inflate law) to an out-of-tree fuzz driver; it
# implies `inflate`, the surface the law is over. `doc(hidden)`, no SemVer guarantee, and never
# enabled by the `gamut` umbrella; the crate's own tests get it via `cfg(test)`.
test-support = ["inflate"]

[dependencies]
gamut-core = { workspace = true, optional = true }
miniz_oxide = { version = "0.8", optional = true }

[dev-dependencies]
# Differential cross-check oracle: a vendored, statically-linked zlib (built from the
# `third_party/zlib` submodule). Dev-only and excluded from the workspace. gamut ships no
# inflater of its own, so zlib is the reference that proves the encoder's output decodes correctly.
zlib-oracle = { path = "../../tooling/zlib-oracle" }
# Benchmark baselines only (dev-only — no effect on the crate's zero runtime dependencies):
# `miniz_oxide` is the pure-Rust encoder behind `flate2`/the `png` crate (the fast/general tier)
# and `zopfli` is the state-of-the-art space-optimal encoder (the tier `Level::Best` competes
# with). The benches assert `Level::Best` earns its keep against both.
divan.workspace = true
miniz_oxide = "0.8"
# The pinned-seed property driving `invariants`' bounded-inflate law (`docs/testing.md`).
proptest.workspace = true
zopfli = "0.8"

[[bench]]
name = "compression"
harness = false
