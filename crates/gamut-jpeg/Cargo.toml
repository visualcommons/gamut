[package]
name = "gamut-jpeg"
description = "Spec-compliant JPEG (ISO/IEC 10918 / ITU-T T.81) still-image codec."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-core.workspace = true
# The shared codestream-backend seam (issue #272): the `Decoder`/`Encoder` twins and `repr(C)`
# vtables the `backend` module's adapters bridge the JPEG whole-stream traits onto.
gamut-codec-abi.workspace = true
# Full-range (JFIF) BT.601 RGB→YCbCr conversion (T.871 §7).
gamut-color.workspace = true
# The §A.3.3 forward DCT kernel and the §A.3.4 round-to-nearest quantizer divide.
gamut-dsp.workspace = true
# Typed metadata (issue #420): the unified `Metadata` model over the raw APP1/APP2 payloads this
# crate locates and writes. Optional and off by default — a plain JPEG consumer pays for none of
# the four metadata crates — and a *normal* dependency (never dev-only), so release ordering
# follows it (`mise run check-release-deps`).
gamut-metadata = { workspace = true, optional = true }

[features]
default = []
# Typed metadata wiring: `JpegMetadata::blocks` / `JpegMetadata::metadata` and
# `JpegEncoder::with_metadata` / `with_encoded_metadata` over the `gamut-metadata` facade.
metadata = ["dep:gamut-metadata"]

[dev-dependencies]
# Differential cross-check oracle: a vendored, statically-linked libjpeg-turbo 3.2.0 (built from the
# `third_party/libjpeg-turbo` submodule). Dev-only and excluded from the workspace. It is the
# canonical reference codec that proves the encoder's output decodes to the same pixels and the
# decoder reproduces what libjpeg-turbo decodes.
libjpeg-oracle = { path = "../../tooling/libjpeg-oracle" }
