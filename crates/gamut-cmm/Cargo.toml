[package]
name = "gamut-cmm"
description = "ICC colour management module: builds and applies colour transforms from parsed ICC profiles."
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
gamut-core.workspace = true
gamut-color.workspace = true
gamut-icc.workspace = true
thiserror.workspace = true

[dev-dependencies]
divan.workspace = true
# Differential oracle: a vendored, statically-linked Little-CMS (lcms2). Dev-only and excluded
# from the workspace, so a plain `cargo build` of this crate never needs a C toolchain; the
# conformance tests do (`git submodule update --init` + a C compiler + libclang).
lcms2-oracle = { path = "../../tooling/lcms2-oracle" }

[[bench]]
name = "pipeline"
harness = false
