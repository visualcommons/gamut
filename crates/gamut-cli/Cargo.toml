[package]
name = "gamut-cli"
description = "Sandbox CLI for the gamut codecs: decode PNG/JPEG/PPM/WebP/JXL and encode AVIF/WebP/TIFF/PNG/JXL/JPEG, plus inspection of the shared color/dsp/bitstream primitives (e.g. `gamut convert input.png output.avif`)."
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# The crate is `gamut-cli` (so `cargo install gamut-cli`), but it ships a `gamut` binary.
[[bin]]
name = "gamut"
path = "src/main.rs"
# The binary shares its name with the `gamut` library, so documenting both writes the same
# `target/doc/gamut/` and `cargo doc --workspace` reports an output filename collision. The
# CLI's surface is its `--help`, not rustdoc.
doc = false

[dependencies]
# `all` pulls in the format codecs plus the `primitives` re-exports (color/dsp/bitstream).
gamut = { workspace = true, features = ["all"] }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
# Decode-only: read PNG/JPEG/PPM inputs. Encoding stays entirely in the gamut crates.
image.workspace = true

[dev-dependencies]
# Parses `gamut inspect --output json` in the binary tests, so they check the document as JSON
# rather than as text. Test-only: the command writes its JSON by hand and never depends on it.
serde_json.workspace = true
