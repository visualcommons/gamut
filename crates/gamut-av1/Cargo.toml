[package]
name = "gamut-av1"
description = "AV1 still-image (intra-frame) encoder — the standalone codec layer beneath AVIF."
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["decode"]
# The AV1 still *decoder* (issue #259). Default-on; turn it off with `default-features = false`
# for an encode-only build. The encoder is never gated.
decode = []

[dependencies]
gamut-core.workspace = true
gamut-color.workspace = true
gamut-dsp.workspace = true
gamut-bitstream.workspace = true

[dev-dependencies]
# libaom (the AV1 reference codec) as the primary, definitive reconstruction oracle, and
# dav1d as an independent corroborating decoder — both FFI to vendored, statically-linked C
# libraries. Dev-only: the shipped library is C-free and needs no decoder. Building these
# tests requires cmake/meson/ninja/nasm and the `third_party/{aom,dav1d}` submodules. Both are
# `update = none`, so fetch them with `mise run fetch-av1-oracles` (issue #378).
aom-oracle = { path = "../../tooling/aom-oracle" }
dav1d-oracle = { path = "../../tooling/dav1d-oracle" }
divan.workspace = true

[[bench]]
name = "encode"
harness = false
