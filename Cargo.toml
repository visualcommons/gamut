[workspace]
resolver = "3"
members = ["crates/*"]
# Dev-only differential oracles that statically link vendored C codecs (libaom, libdav1d,
# libavif) from `third_party/` submodules. Excluded from the workspace so a plain
# `cargo build` of the shipped crates does not build them — they are pulled in
# only as path `dev-dependencies` when building the cross-check tests. See their
# manifests under `tooling/`.
# NB: the shipped crates are otherwise pure Rust with one exception — `gamut-jxl-sys` (a workspace
# member) statically builds libjxl via cmake, so a workspace `cargo build`/`test` needs cmake + a
# C++ toolchain (skippable for `cargo check` with GAMUT_JXL_SYS_SKIP_NATIVE=1; see its README).
exclude = [
    "tooling/aom-oracle",
    "tooling/dav1d-oracle",
    "tooling/libavif-oracle",
    "tooling/libtiff-oracle",
    "tooling/lcms2-oracle",
    "tooling/gamut-dng-oracle",
    # Dev-only conformance tier over the real-camera DNG corpus in the `gamut-dng-samples`
    # submodule (issue #174). Excluded so `cargo test --workspace` never pulls in ~178 MiB of
    # camera files or the slow SDK oracle build; run it explicitly with `mise run test-dng-real`.
    "tooling/gamut-dng-real-conformance",
    # Dev-only fuzz tier (issues #264, #311): drives the crates' `invariants` laws under
    # libFuzzer. Excluded because it needs nightly (`-Z sanitizer=fuzzer`) while the workspace
    # pins stable, and because a coverage-guided engine is unbounded and so cannot sit in the
    # `coverage` job, the only gate that runs tests. Run it with `mise run fuzz`.
    "tooling/gamut-fuzz",
    "tooling/gamut-iptc-oracle",
    "tooling/zlib-oracle",
    "tooling/libpng-oracle",
    "tooling/libjpeg-oracle",
    "tooling/exiv2-oracle",
    "tooling/libheif-oracle",
    # Dev-only helper that builds a vendored nasm from a committed source tarball so the
    # oracles above can assemble the aom/dav1d x86 SIMD without a system nasm. Excluded for
    # the same reason: a plain `cargo build` of the shipped crates must never compile it.
    "tooling/nasm-vendor",
    # Dev-only helper that normalises ambient compiler-launcher env (sccache/ccache) so the
    # oracles' cmake/meson builds are hermetic to exactly what they configure. Excluded for the
    # same reason: a plain `cargo build` of the shipped crates must never compile it.
    "tooling/build-env",
]

[workspace.package]
# No shared `version`: each crate is versioned independently (see README "Versioning").
edition = "2024"
rust-version = "1.92" # MSRV; see README "Minimum Supported Rust Version"
authors = ["Justin Chung"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/justin13888/gamut"
homepage = "https://github.com/justin13888/gamut"
readme = "README.md"
keywords = ["image", "codec", "encoding", "compression"]
categories = ["multimedia::images", "encoding", "compression"]
# `description` is set per-crate for better crates.io discoverability.

[workspace.lints.rust]
missing_docs = "warn" # becomes a hard error under `clippy -D warnings` in CI

[workspace.dependencies]
# Third-party
thiserror = "2.0.18"
serde = { version = "1", features = ["derive"] }
geocoordinates = { version = "0.14", default-features = false }
# MD5 for the ICC profile ID (ICC.1:2022 §7.2.18) — a content fingerprint mandated by the format,
# not a security primitive. RustCrypto, pure-Rust, no_std-compatible.
md-5 = { version = "0.10", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
bitflags = "2.6"
clap = { version = "4.5", features = ["derive"] }
# XML reader for gamut-xmp's RDF/XML parser. Used only internally — gamut-xmp's public API (its
# error type included) exposes no quick-xml types, so this stays an implementation detail that can
# be bumped without a breaking change. Default features only (UTF-8; the namespace-resolving
# `NsReader` is in core).
quick-xml = "0.40"
wasm-bindgen = "0.2"
# Decode-only: gamut-cli reads PNG/JPEG/PPM inputs; all encoding stays in gamut crates.
# `default-features = false` drops image's own avif/webp decoders and rayon.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "pnm"] }
# Pure-Rust JPEG XL decoder (jxl-rs) from the libjxl org, BSD-3-Clause. gamut-jxl's decode path
# wraps it (the crate has no encoder — that is libjxl via gamut-jxl-sys). The default `all-simd`
# feature is OFF because it enables `avx512`, whose intrinsics need Rust 1.89+ and x86-only
# nightly-adjacent paths; the listed per-arch features are cfg-gated internally and safe to enable
# on every target (including wasm32, where they compile out).
jxl = { version = "0.4.3", default-features = false, features = ["sse42", "avx", "neon"] }
# libwebp FFI — used ONLY as a dev-dependency oracle in gamut-webp's differential tests, never
# in shipped code. Handwritten bindings (no bindgen/libclang); statically links bundled libwebp,
# so the test build needs a C toolchain while the library itself stays C-free.
#   * `static` builds the bundled libwebp sources unconditionally instead of probing pkg-config for a
#     system libwebp. That makes the oracle hermetic (the workspace policy: no system-installed
#     codecs) and, with `mux` below, avoids a partial system install — a libwebp without libwebpmux —
#     failing the build script.
#   * `mux` adds libwebpmux, the reference muxer for the metadata chunks (`ICCP`/`EXIF`/`XMP `).
#     It is how `cwebp -metadata all` attaches them, so it is the oracle for gamut-webp's metadata
#     round-trip in both directions.
#   * `demux` adds libwebpdemux, whose `WebPDemux` is the reference *container parser*: it walks the
#     RIFF chunk structure and reports each chunk and the canvas. That makes it gamut-riff's own
#     oracle — the crate codes no bitstream, so the container is the whole of what it must get right.
libwebp-sys2 = { version = "0.2", features = ["demux", "mux", "static"] }
# Benchmark harness (issue #149). Dev-only: pulled in as a `dev-dependency` by each crate's
# `[[bench]]` target, never by shipped code. Lightweight (few transitive deps) and reports
# throughput counters; `mise run bench` runs the suite.
divan = "0.1"
# JSON reader for conformance drift-guard tests only: gamut-iptc pins its hand-transcribed
# IIM↔XMP tables to the vendored IPTC machine-readable tech reference at test time. Dev-only,
# untyped `Value` API (no serde derives) — never a dependency of shipped code.
serde_json = "1"
# Property testing (issue #240). Dev-only: pulled in as a `dev-dependency` by the crates whose
# `invariants` module states executable laws, never by shipped code. Every gamut property pins
# `rng_seed`, finite shrink bounds and `failure_persistence: None` IN CODE (`docs/testing.md`),
# because the `--in-diff` mutation gate is blocking and cargo-mutants' pass/fail must be
# reproducible run to run — the `PROPTEST_*` env overrides are additionally `#[cfg]`'d out on
# wasm32, so configuration outside the code silently stops applying on any target the workspace
# tests there. `default-features = false` drops `fork`/`timeout` (rusty-fork, tempfile,
# wait-timeout and friends), which the mutants runner's per-process `ulimit -v` makes unusable
# anyway; `bit-set` stays, because collection shrinking is the reason to adopt proptest at all.
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }

# Internal crates. `path` is used for local builds so cross-crate edits resolve without a
# crates.io round-trip; `version` is the requirement recorded in the published manifest.
# Versions are independent per crate — release-plz rewrites these requirements automatically
# when a dependency's version bumps.
gamut-core = { path = "crates/gamut-core", version = "2.0.1" }
gamut-color = { path = "crates/gamut-color", version = "2.0.0" }
gamut-dsp = { path = "crates/gamut-dsp", version = "2.0.0" }
gamut-bitstream = { path = "crates/gamut-bitstream", version = "0.2.3" }
# The shared codestream-backend seam (issue #272): repr(C) vtables + object-safe Rust twins that
# let a foreign/alternate codec backend plug into any format crate. no_std, dependency-free.
gamut-codec-abi = { path = "crates/gamut-codec-abi", version = "0.1.1" }
gamut-deflate = { path = "crates/gamut-deflate", version = "0.1.0" }
gamut-png = { path = "crates/gamut-png", version = "0.1.0" }
# JPEG-1 (ISO/IEC 10918 / ITU-T T.81) codec (issue #28).
gamut-jpeg = { path = "crates/gamut-jpeg", version = "0.1.0" }
gamut-isobmff = { path = "crates/gamut-isobmff", version = "2.0.1" }
gamut-riff = { path = "crates/gamut-riff", version = "1.0.0" }
gamut-av1 = { path = "crates/gamut-av1", version = "0.4.1" }
gamut-av2 = { path = "crates/gamut-av2", version = "0.1.3" }
gamut-avif = { path = "crates/gamut-avif", version = "1.1.0" }
# `default-features = false` so consumers pick their halves: gamut-dng needs only the pure-Rust
# `decode`; the umbrella re-enables both.
gamut-jxl = { path = "crates/gamut-jxl", version = "0.4.0", default-features = false }
# Static libjxl build + hand-written FFI for gamut-jxl's encoder. Unlike every other shipped crate,
# building this one runs cmake to compile libjxl (see its README); `links = "jxl"`.
gamut-jxl-sys = { path = "crates/gamut-jxl-sys", version = "0.1.0" }
gamut-webp = { path = "crates/gamut-webp", version = "0.3.1" }
gamut-heic = { path = "crates/gamut-heic", version = "0.2.2" }
gamut-vvc = { path = "crates/gamut-vvc", version = "0.2.1" }
gamut-tonemap = { path = "crates/gamut-tonemap", version = "1.0.0" }
# Image metadata primitives (issue #34): the shared TIFF/IFD core plus per-format crates.
gamut-ifd = { path = "crates/gamut-ifd", version = "2.0.1" }
gamut-icc = { path = "crates/gamut-icc", version = "1.0.0" }
# ICC colour management module — applies profiles parsed by gamut-icc (issue #323).
gamut-cmm = { path = "crates/gamut-cmm", version = "0.1.0" }
gamut-xmp = { path = "crates/gamut-xmp", version = "1.0.0" }
gamut-exif = { path = "crates/gamut-exif", version = "1.0.0" }
gamut-iptc = { path = "crates/gamut-iptc", version = "1.0.0" }
gamut-metadata = { path = "crates/gamut-metadata", version = "1.0.0" }
# Self-contained TIFF 6.0 codec (issue #107).
gamut-tiff = { path = "crates/gamut-tiff", version = "1.0.0" }
# DNG raw-image codec (issue #109): a TIFF/EP profile built on gamut-ifd.
gamut-dng = { path = "crates/gamut-dng", version = "1.0.0" }
gamut = { path = "crates/gamut", version = "0.3.2" }

# Debug info lives beside the artefacts instead of inside each one. A `cargo test --all-features`
# build links 172 test binaries and packed DWARF is copied into every one of them: a sampled
# test binary was 0.78 MiB of `.text` under 64.8 MiB of debug sections. `unpacked` emits the DWARF
# once per codegen unit as `.dwo` files that the binaries reference, which costs no debug
# information at all — but it does mean a binary is no longer self-contained, so one copied out of
# `target/` loses it. Debug and profile them where they were built.
[profile.dev]
split-debuginfo = "unpacked"

# The three packages that compile vendored C/C++ take their `CMAKE_BUILD_TYPE` (via cmake-rs) and
# their `-O`/`-g` flags (via cc) from the `OPT_LEVEL` and `DEBUG` that cargo derives from this
# profile, which at the dev default is `-O0 -g`. That built `libjxl.a` at 181.7 MiB against
# 8.1 MiB for the same archive at `Release`, and the cost is paid again in every binary that
# statically links it and again in every superseded build-script output directory, which cargo
# never reclaims. None of it is gamut's own code and none of it is ever stepped through from Rust.
# The hand-written oracles under `tooling/` already pass `-DCMAKE_BUILD_TYPE=Release` for this
# reason; these three cannot, because they delegate to `jpegxl_src::build()` and to `cc::Build`,
# neither of which accepts that define. Setting the profile is the only lever they share.
[profile.dev.package.gamut-jxl-sys]
opt-level = 2
debug = false

[profile.dev.package.gamut-dng-oracle]
opt-level = 2
debug = false

[profile.dev.package.lcms2-oracle]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.fast-debug]
inherits = "release"
debug = 1
incremental = true

[profile.test]
opt-level = 3
debug = 1
split-debuginfo = "unpacked"
incremental = true

# Mutation testing (`.cargo/mutants.toml` selects it with `profile = "mutants"`). Identical to
# `test` except for debug info, which is the largest per-mutant cost that buys nothing: a mutation
# run reads pass/fail and never a backtrace, while `[profile.test]` links 139 integration binaries
# at full optimisation with DWARF — once per mutant, in a cold build directory. `opt-level` is
# deliberately kept at 3 so the oracle differential tests run at the same speed the gate sees.
# `incremental` is off because every mutant builds in a fresh copy of the tree, so an incremental
# cache can only ever be written, never read.
[profile.mutants]
inherits = "test"
debug = 0
incremental = false

[profile.bench]
lto = "thin"
codegen-units = 1
