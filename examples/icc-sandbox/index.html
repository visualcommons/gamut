<!doctype html>
<!-- The ICC sandbox's browser host: one canvas and the wasm-bindgen module loader. Built into
     target/web by `mise run icc-sandbox-web`. The app hands the canvas untagged sRGB that
     gamut-cmm already converted, so the browser's colour management has nothing to redo. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gamut ICC sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="icc-sandbox"></canvas>
    <script type="module">
      import init from "./icc-sandbox.js";
      init();
    </script>
  </body>
</html>
