# Developer tooling for gamut, managed by mise (https://mise.jdx.dev).
#
# Bootstrap after cloning:
#   mise trust && mise install
# Activate mise in your shell (e.g. `eval "$(mise activate zsh)"`) so these land on
# PATH — the git hooks (hk) and the mise tasks below invoke them directly.
#
# Not managed here:
#   * Rust   — pinned by rustup via rust-toolchain.toml.
#   * pkg-config — system package (apt/brew); lacks a clean mise backend and is only needed
#     to build the vendored dav1d/libavif cross-check oracles.
#   * nasm   — also lacks a clean mise backend, so the oracle build scripts build it from a
#     committed source tarball (tooling/nasm-vendor); it is not a system dependency.

[tools]
# Dev workflow
hk                            = "1.48.0"  # git hook runner (jdx); config in hk.pkl, `hk install` registers hooks
jq                            = "1.8.1"
"cargo:convco"                = "0.6.4"   # conventional-commit linter (built from source: its release assets are named convco-{ubuntu,deb,macos}.zip, which the ubi/github backend can't match, and there's no macOS-arm64 asset)
"aqua:taiki-e/cargo-llvm-cov" = "0.8.7"   # coverage (taiki-e prebuilt binary)
"cargo:cargo-edit"            = "0.13.11" # `cargo set-version` for `mise run bump` (compiled from source)
"cargo:cargo-mutants"         = "27.1.0"
"cargo:cargo-fuzz"            = "0.13.1"
"cargo:cbindgen"              = "0.29.4"  # gamut-ffi C header generation (gen-ffi-header / check-ffi-header)

# Native build deps for the cross-check tests (build vendored dav1d/libavif from third_party/)
cmake                         = "4.3.3"
ninja                         = "1.13.2"
meson                         = "1.11.1"  # pipx backend — needs a python3 on PATH

# ── Dev tasks (ported from the former justfile) ──────────────────────────────
# Run with `mise run <task>` (or `mise <task>`); list them with `mise tasks`.
# The fmt/lint/test/coverage tasks are the single source of truth for those
# commands: the git hooks and CI both invoke them, so there is one canonical
# invocation and local/CI can never drift apart.

# Ensure a nightly rustfmt is available. The merge-resilient import options in rustfmt.toml
# (imports_granularity/group_imports) are nightly-only, so fmt runs on nightly while the rest
# of the workspace stays on the pinned stable toolchain. `rustup component add` succeeds when
# nightly is already installed and errors otherwise, falling through to a minimal install —
# so this self-heals both locally and in CI, and `mise run fmt` "just works" on a fresh clone.
[tasks.ensure-nightly-rustfmt]
hide = true
run = "rustup component add rustfmt --toolchain nightly 2>/dev/null || rustup toolchain install nightly --profile minimal --component rustfmt"

[tasks.fmt]
description = "Format code (nightly rustfmt; merge-resilient imports)"
depends = ["ensure-nightly-rustfmt"]
run = "cargo +nightly fmt --all"
depends_post = ["fmt-tooling"]

[tasks.fmt-check]
description = "Check formatting without modifying (nightly rustfmt)"
depends = ["ensure-nightly-rustfmt"]
run = "cargo +nightly fmt --all --check"
depends_post = ["fmt-tooling-check"]

# `cargo fmt --all` formats workspace *members*, and `members = ["crates/*"]` — so no crate under
# `tooling/` has ever been fmt-gated. This is wider than the compile gap `check-dng-real` closes:
# that one is unique to `gamut-dng-real-conformance`, the only excluded crate nothing depends on,
# whereas rustfmt is blind to all fifteen — a path dev-dependency edge makes a crate reachable to
# `clippy --workspace --all-targets`, but does nothing for `fmt --all`. Hung off `fmt`/`fmt-check`
# rather than exposed as a separate gate so the hooks (hk.pkl) and CI inherit it with no second
# call site to keep in sync. rustfmt compiles nothing, so iterating the manifests costs seconds.
# The glob tracks `[workspace].exclude`; a `tooling/` crate promoted to a member would just be
# formatted twice, which is idempotent.
#
# Deliberately *not* `--all` on each manifest: that flag means "all packages, and also their local
# path-based dependencies", so `gamut-dng-real-conformance` alone drags the whole `crates/` tree
# back in — 483 of the 518 files such a loop reaches, every one already covered by the `fmt --all`
# above — and reports one drifting file once per dependent crate that can see it, up to 18 times
# for a single file. Iterating the manifests bare visits each crate's own targets (lib, examples,
# tests) exactly once: the same `tooling/` coverage — set-identical, all 35 files across all 15
# crates — for 35 file-visits instead of 1131.
[tasks.fmt-tooling]
description = "Format the workspace-excluded tooling crates (`fmt --all` stops at the workspace boundary)"
depends = ["ensure-nightly-rustfmt"]
run = "for m in tooling/*/Cargo.toml; do cargo +nightly fmt --manifest-path \"$m\"; done"

[tasks.fmt-tooling-check]
description = "Check formatting of the workspace-excluded tooling crates"
depends = ["ensure-nightly-rustfmt"]
# Deliberately does not stop at the first drifting crate, so one run names every one of them.
run = "fail=0; for m in tooling/*/Cargo.toml; do cargo +nightly fmt --manifest-path \"$m\" --check || fail=1; done; exit $fail"

[tasks.lint]
description = "Lint with Clippy (warnings as errors)"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Lint and auto-fix"
run = "cargo clippy --workspace --fix --allow-dirty --allow-staged"

# Fast lint for the pre-push hook: default features, lib/bin targets only, so it
# does NOT compile the `--all-targets`/`--all-features` cross-check oracle dev-deps
# (the vendored C codecs). The full `lint` above is the gate CI runs. `check-ffi` rides
# along because gamut-ffi's living shims are cfg'd out under default features and would
# otherwise only fail in CI's --all-features lanes.
[tasks.lint-quick]
description = "Fast Clippy check (default features; no C-oracle build) for the pre-push hook"
run = "cargo clippy --workspace -- -D warnings"
depends_post = ["check-ffi"]

# Extended portability checks (run on master / manual dispatch in CI, see .github/workflows/extended.yml).
# Both `cargo check` the shipped library surface only — no `--all-targets`/`--tests`, so the C-oracle
# dev-deps never compile and no submodules/C toolchain are needed. `gamut-cli` (a binary sandbox pulling
# clap/image) is excluded as it is not a shipped "core library".
[tasks.check-cross]
description = "Cross-compile-check the shipped libraries for a target triple, e.g. `mise run check-cross wasm32-unknown-unknown`"
run = """
rustup target add {{arg(name='target')}}
# GAMUT_JXL_SYS_SKIP_NATIVE=1: skip gamut-jxl-sys's libjxl cmake build (no cross C++ toolchain for
# aarch64/musl here, and no emsdk for the wasm32-unknown-emscripten check row); safe because
# `cargo check` compiles but never links. wasm32-unknown-unknown skips the native build on its own.
GAMUT_JXL_SYS_SKIP_NATIVE=1 cargo check --workspace --exclude gamut-cli --all-features --target {{arg(name='target')}}
"""

# The JPEG XL wasm *test* lane: unlike `check-cross` this genuinely builds libjxl with the emsdk
# toolchain and runs the full gamut-jxl differential suite (pure-Rust jxl-rs decode vs the
# wasm-built libjxl oracle) under node. Needs an installed AND activated emsdk (`emcc` on PATH).
# emsdk version: a recent release is required — rustc's own CI builds the target's std with
# `emsdk install latest`, and old emsdks fail at link time (e.g. 3.1.68's wasm-opt predates the
# `--enable-bulk-memory-opt` feature flag rustc 1.97 emits). CI pins 6.0.2 (verified); bump it
# together with toolchain updates.
# -sALLOW_MEMORY_GROWTH=1: rustc's default emscripten link uses a fixed 16 MiB heap and passes
# -sABORTING_MALLOC=0, so a large libjxl allocation (brotli in the jbrd path) gets a NULL malloc
# and kills the process; growable memory is how libjxl's own wasm builds run.
[tasks.test-jxl-wasm]
description = "Build and run the JPEG XL crates' tests on wasm32-unknown-emscripten (needs emsdk's emcc + node on PATH)"
run = """
command -v emcc >/dev/null || { echo "emcc not found: install and activate emsdk first (https://emscripten.org)"; exit 1; }
rustup target add wasm32-unknown-emscripten
CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS="-C link-arg=-sALLOW_MEMORY_GROWTH=1" \
CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUNNER=node \
cargo test -p gamut-jxl-sys -p gamut-jxl --all-features --target wasm32-unknown-emscripten
"""

# The MSRV lives once as the machine value in the root Cargo.toml (`rust-version`); the README is the
# authoritative human documentation. This reads the version from Cargo.toml and FAILS unless the README
# documents that same version, so the two can never drift — nothing hardcodes the number here.
[tasks.check-msrv]
description = "Check the shipped libraries compile on the documented MSRV (read from Cargo.toml; asserts the README documents it)"
run = """
msrv="$(sed -nE 's/^rust-version = "([^"]+)".*/\\1/p' Cargo.toml)"
test -n "$msrv" || { echo "could not read rust-version from Cargo.toml"; exit 1; }
grep -qF "$msrv" README.md || { echo "README.md does not document MSRV $msrv"; exit 1; }
rustup toolchain install "$msrv" --profile minimal
# GAMUT_JXL_SYS_SKIP_NATIVE=1: skip gamut-jxl-sys's libjxl cmake build; safe because `cargo check`
# compiles but never links.
GAMUT_JXL_SYS_SKIP_NATIVE=1 cargo +"$msrv" check --workspace --exclude gamut-cli --all-features
"""

[tasks.check-commits]
description = "Check this branch's commits follow Conventional Commits (convco)"
run = 'convco check "$(git merge-base origin/master HEAD)..HEAD"'

[tasks.install-cli]
description = "Install the gamut CLI binary"
run = "cargo install --path crates/gamut-cli"

[tasks.test]
description = "Run tests (workspace, all features)"
run = "cargo test --workspace --all-features"

# The AV1 reference codecs (issue #378). `aom` and `dav1d` are `update = none` in `.gitmodules`,
# so `git submodule update --init --recursive` skips them and a git consumer of any gamut crate
# does not pay ~440 MiB for codecs it never builds. Only the dev-only oracles need them, so any
# task or CI job that builds `aom-oracle`, `dav1d-oracle` or `libavif-oracle` must run this first.
[tasks.fetch-av1-oracles]
description = "Fetch the aom/dav1d submodules (~440 MiB; needed by the AV1/AVIF oracle tests)"
run = "git submodule update --init --checkout third_party/aom third_party/dav1d"

# Real camera DNGs (issue #174). The corpus is the `gamut-dng-samples` submodule — ~178 MiB of
# CC0 files written by actual cameras — and the harness is `tooling/gamut-dng-real-conformance`,
# excluded from the workspace so `test` above never drags either in. Off the per-PR path by
# design; the `real-dng` job in `.github/workflows/extended.yml` runs it on master and on demand.
[tasks.fetch-dng-samples]
description = "Fetch the real-camera DNG corpus submodule (~178 MiB; needed by test-dng-real)"
run = "git submodule update --init --checkout third_party/gamut-dng-samples"

# Coverage-guided fuzzing of the `invariants` laws (issues #264, #311). Deliberately NOT in the
# per-PR path: `coverage` is the only gate that runs tests, so anything in it must be bounded and
# reproducible, and a corpus-guided engine is neither -- see `docs/testing.md`.
#
# Needs nightly for libFuzzer's `-Z sanitizer=fuzzer`; the workspace pins stable, so this selects
# nightly for this crate only, the same shape as `fmt` selecting nightly rustfmt.
#
#   mise run fuzz                        # list the targets
#   mise run fuzz ifd_read_ledger        # run one until it finds something or you stop it
#   mise run fuzz ifd_read_ledger -- -max_total_time=60
#
# A crash is minimised and then promoted into a *named deterministic test* in the crate's own
# suite. The corpus is a search aid, not the regression record.
[tasks.fuzz]
description = "Coverage-guided fuzzing of the invariants laws; `mise run fuzz <target>`"
run = "./tooling/gamut-fuzz/run.sh"

[tasks.test-dng-real]
description = "Validate gamut-dng against real camera DNGs (issue #174; needs fetch-dng-samples)"
run = "cargo test --manifest-path tooling/gamut-dng-real-conformance/Cargo.toml"

# The compile half of the tier above, and the only part of it the per-PR lane can afford. That
# crate is excluded from the workspace *and* nothing depends on it — it is invoked by manifest
# path — so `clippy --workspace --all-targets` and `test --workspace` never build it, and a
# gamut-dng API change can break it while every per-PR gate stays green (#353 removed
# `DecodedDng::exif_extra` and only master's extended run noticed, at compile time, before a
# single sample was decoded). `check` needs no corpus, which is what makes this cheap enough for
# the lint job; the corpus-backed assertions stay in `test-dng-real`.
[tasks.check-dng-real]
description = "Compile the real-camera DNG conformance tier (no corpus needed)"
run = "cargo check --manifest-path tooling/gamut-dng-real-conformance/Cargo.toml --all-targets"

# Doctests only. On stable, `cargo llvm-cov` cannot instrument doctests (that needs nightly), so
# the coverage gate — which CI uses as its green-test gate — silently skips them. This task is the
# missing slice: CI's lint lane runs it, reusing the `--all-targets --all-features` build it just
# did for Clippy, so the marginal cost is compiling and running the doctests, not another full
# build. Locally, prefer plain `test` above; it covers these too.
[tasks.test-doc]
description = "Run doctests only (the slice `coverage` cannot instrument on stable)"
run = "cargo test --workspace --all-features --doc"

# Divan; issue #149. Like `test`, this builds the codec crates' cross-check-oracle
# dev-dependencies, so it needs the submodules (including `fetch-av1-oracles`) + C toolchain.
# To pass Divan flags (e.g. `--sample-count 50`) target one harness directly, since the
# per-crate libtest stubs reject them: `cargo bench -p gamut-webp --bench codec -- <flags>`.
[tasks.bench]
description = "Run performance benchmarks (Divan; issue #149)"
run = "cargo bench --workspace"

# Runs every bench ONCE, to prove it still executes (issue #437). Divan's own flag for it:
# "Run benchmarks once to ensure they run successfully". This is not a performance measurement and
# must not be read as one -- it takes no timings and asserts no thresholds.
#
# What it adds over the existing gates is narrow but real. `mise run lint` is
# `cargo clippy --workspace --all-targets --all-features`, and `--all-targets` includes
# `--benches`, so every bench file is already *compiled* on every PR and cannot rot silently. What
# nothing did was *run* one, so a bench that panics in setup -- a bad fixture, a wrong dimension,
# an `unwrap` on an encode that now fails -- was invisible.
#
# `--benches` restricts this to bench targets. Without it `cargo bench` also builds every lib and
# test target in release just to look for `#[bench]` functions that do not exist here (all 16
# benches are `harness = false` Divan), which is a second full release build for nothing.
[tasks.bench-test]
description = "Run every bench once to prove it still executes (no timings; issue #437)"
run = "cargo bench --workspace --benches -- --test"

# Bindings/binary crates (cli, wasm, ffi), the declarations-only `gamut-jxl-sys` FFI crate, and the
# dev-only `tooling/` oracles are excluded — their entry points are not meaningfully unit-testable
# (jxl-sys has no function bodies at all) and would otherwise skew the gate.
[tasks.coverage]
description = "Run tests with coverage (enforces 80% line coverage)"
run = "cargo llvm-cov --workspace --all-features --ignore-filename-regex '(crates/gamut-(cli|wasm|ffi|jxl-sys)|tooling)/' --fail-under-lines 80"

# What CI runs: `coverage` plus an lcov artifact. Kept as a task rather than inlined in ci.yml so
# the exclusion regex and the 80% threshold live in exactly one place — when CI spelled its own
# invocation, the two copies could drift silently. Keep the flags in sync with `coverage` above.
[tasks.coverage-lcov]
description = "Run the coverage gate and write lcov.info (what CI runs)"
run = "cargo llvm-cov --workspace --all-features --ignore-filename-regex '(crates/gamut-(cli|wasm|ffi|jxl-sys)|tooling)/' --fail-under-lines 80 --lcov --output-path lcov.info"

# Mutation testing. Every entry point — this task, the mutants CI workflow, and an agent's tight
# debug loop — goes through `tooling/mutants/run.sh`, so the dials cannot drift between them.
# That script is where the reasoning lives; the short version is that the thing which runs out
# first is memory, not cores, and the number that matters is a *product*: MUTANTS_JOBS scenarios,
# each running CARGO_BUILD_JOBS build scripts, each fanning out to CMAKE_BUILD_PARALLEL_LEVEL
# compilers. Bounding only the outer dial is what makes "1 job" mean sixteen memory-hungry
# compiles. So every dial is derived from one memory budget, the run is wrapped in a systemd
# memory scope, and each process gets an address-space limit — which is what turns a mutant that
# allocates without limit into one `caught` result instead of an OOM kill that takes the whole
# run down with it. See docs/mutation-testing.md.
[tasks.mutants]
description = "Mutation testing; `mise run mutants -- --help` for selection and budget flags"
run = "./tooling/mutants/run.sh"

# Aliases for the two selections used most. Both delegate to the same runner, so they get the
# same budget, guards and dials as everything else. Arguments after the task name reach the
# runner; anything after a second `--` is passed through to cargo-mutants verbatim.
[tasks.mutants-diff]
description = "Mutation testing of only the code changed vs master; fast (mirrors PR CI)"
run = "./tooling/mutants/run.sh --diff"

[tasks.mutants-crate]
description = "Mutation testing of one crate, e.g. `mise run mutants-crate gamut-bitstream`"
run = "./tooling/mutants/run.sh --crate"

# release-plz orders normal and build dependencies, but deliberately ignores ordinary
# dev-dependencies. A versioned dev-only edge between publishable workspace crates can therefore
# make a major bump unpublishable: Cargo records the new requirement in the packaged manifest,
# while release-plz may try the dependent first. Cross-crate interoperability tests belong in a
# package (normally the gamut umbrella) that has real dependency edges to both sides.
# Mechanical conventions from `docs/testing.md` (issue #435): every integration-test file names
# what it pins, every proptest configuration pins its seed and disables failure persistence, and
# differential files lead with `oracle`. Three rules that each hold across the whole corpus today
# and each fail for one reason -- a lint for a convention that does not yet hold is noise.
[tasks.check-tests]
description = "Enforce the mechanical test conventions in docs/testing.md"
run = "./tooling/check-tests/run.sh"

[tasks.check-release-deps]
description = "Reject publishable dev-only workspace edges that release-plz cannot order"
run = '''cargo metadata --no-deps --format-version 1 | jq -r -e '
  (.workspace_members | map({key: ., value: true}) | from_entries) as $members
  | [.packages[] | select($members[.id]) | select(.publish != [])] as $publishable
  | ($publishable | map({key: .name, value: true}) | from_entries) as $names
  | [
      $publishable[] as $package
      | $package.dependencies[] as $dependency
      | select($dependency.kind == "dev")
      | select($dependency.name != $package.name)
      | select($names[$dependency.name])
      | select([
          $package.dependencies[]
          | select(.name == $dependency.name and (.kind == null or .kind == "build"))
        ] | length == 0)
      | "\($package.name) -> \($dependency.name)"
    ] as $violations
  | if $violations | length == 0
    then "release dependency graph has no dev-only workspace edges"
    else error("publishable dev-only workspace dependencies are invisible to release-plz:\n\($violations | join("\n"))")
    end
' '''

# gamut-ffi's feature table must strictly mirror gamut's (issue #242): identical feature-name
# set, each feature forwarding the same-named gamut feature, and `all`/`default` member-for-member
# equal. Metadata-only, near-free; CI runs it in the lint job.
[tasks.check-ffi-features]
description = "Verify gamut-ffi's feature table strictly mirrors gamut's"
run = '''cargo metadata --no-deps --format-version 1 | jq -e '
  (.packages[] | select(.name == "gamut").features) as $g
  | (.packages[] | select(.name == "gamut-ffi").features) as $f
  | ($g | with_entries(if .key == "all" or .key == "default" then . else .value = ["gamut/\(.key)"] end)) as $want
  | if $f == $want then "gamut-ffi features in sync with gamut"
    else error("gamut-ffi features out of sync with gamut:\nwant \($want)\ngot  \($f)") end' '''

# The committed C header (crates/gamut-ffi/include/gamut.h) is generated from the Rust source
# of truth by cbindgen — plain parse on the pinned stable toolchain, never handwritten, never
# hand-edited (see gamut-ffi/DESIGN.md).
[tasks.gen-ffi-header]
description = "Regenerate gamut-ffi's committed C header"
run = "cbindgen --config crates/gamut-ffi/cbindgen.toml --output crates/gamut-ffi/include/gamut.h crates/gamut-ffi"

[tasks.check-ffi-header]
description = "Verify the committed C header matches cbindgen output (fix: mise run gen-ffi-header)"
run = '''cbindgen --config crates/gamut-ffi/cbindgen.toml crates/gamut-ffi 2>/dev/null | diff -u crates/gamut-ffi/include/gamut.h - \
  || { echo "gamut-ffi header out of date: run 'mise run gen-ffi-header' and commit the result"; exit 1; }'''

# A format crate *gaining* a seam is the one drift class gamut-ffi cannot catch at compile
# time (nothing there can reference an entry point that does not exist yet), so it is gated
# here: the workspace's `pub fn push_backend` set is diffed against the committed manifest
# (crates/gamut-ffi/SEAMS.txt — pure data, no comments, so the diff is exact). Every manifest
# line must have a C entry point in gamut-ffi or a documented exclusion in its DESIGN.md.
# Losing or reshaping a seam already breaks gamut-ffi's living shims at compile time.
[tasks.check-ffi-seams]
description = "Verify the workspace push_backend seam set matches gamut-ffi's manifest"
run = '''grep -rn --include='*.rs' 'pub fn push_backend' crates/*/src \
  | sed -E 's/:[0-9]+:/ /; s/[[:space:]]+/ /g; s/ $//' | sort \
  | diff -u crates/gamut-ffi/SEAMS.txt - \
  || { echo "push_backend seam set changed: give the seam a C entry point (or a DESIGN.md exclusion) in gamut-ffi, then update crates/gamut-ffi/SEAMS.txt"; exit 1; }'''

# Fast pre-push guard for the FFI living shims: gamut-ffi's entry points only compile when
# their format features are on, and lint-quick runs default features — so without this, shim
# drift would first surface in CI's --all-features lanes. Check-only, so the libjxl native
# build is skipped.
[tasks.check-ffi]
description = "Type-check gamut-ffi with every feature on (the living-shim drift gate)"
env = { GAMUT_JXL_SYS_SKIP_NATIVE = "1" }
run = "cargo check -p gamut-ffi --all-features"

[tasks.versions]
description = "List every workspace crate and its version"
run = '''cargo metadata --no-deps --format-version 1 | jq -r '.packages | sort_by(.name)[] | "\(.name) \(.version)"' '''

# Convenience/escape hatch; routine bumps are automated by release-plz from
# conventional commits.
[tasks.bump]
description = "Bump a crate's version (level = major | minor | patch)"
run = "cargo set-version -p {{arg(name='crate')}} --bump {{arg(name='level')}}"
